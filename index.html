  <script>/* ===== js/api.js ===== */
/* =========================================================
   API-шар. Інтерфейс усюди використовує лише API.*
   - CONFIG.MOCK = true  → демо-логіка нижче (без сервера)
   - CONFIG.MOCK = false → реальні запити на твій бекенд
   Кожен запит несе initData — бекенд ОБОВ'ЯЗКОВО перевіряє його підпис
   (HMAC з токеном бота), щоб знати, хто справді робить запит.
   ========================================================= */
(function () {
  const C = window.CONFIG;
  const round = (n) => Math.round(n * 100) / 100;
  const ceil2 = (n) => Math.ceil(n * 100 - 1e-6) / 100;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const err = (key, p) => new Error(t(key, p));

  // Комісія угоди. payer: buyer | seller | split (навпіл)
  // total — скільки платить покупець, payout — скільки отримує продавець
  function calcFee(price, payer = C.DEFAULT_FEE_PAYER) {
    const fee = round((price * C.FEE_PERCENT) / 100);
    const buyerFee = payer === "buyer" ? fee : payer === "split" ? round(fee / 2) : 0;
    const sellerFee = round(fee - buyerFee);
    return { price: round(price), fee, feePayer: payer, buyerFee, sellerFee, total: round(price + buyerFee), payout: round(price - sellerFee) };
  }
  // Комісія обміну: 3% від оцінки NFT + 3% від доплати. payer: creator | taker | split
  // creatorPays / takerPays — скільки кожен сплачує ДО старту (його частина комісії + доплата, якщо вона на ньому)
  function calcSwap(value, topup = 0, feePayer = "taker", topupFrom = null) {
    topup = topupFrom ? Number(topup) || 0 : 0;
    const feeNft = round((value * C.EXCHANGE_FEE_PERCENT) / 100);
    const feeTopup = round((topup * C.TOPUP_FEE_PERCENT) / 100);
    const fee = round(feeNft + feeTopup);
    const creatorFee = feePayer === "creator" ? fee : feePayer === "split" ? round(fee / 2) : 0;
    const takerFee = round(fee - creatorFee);
    return {
      value: round(value), topup: round(topup), topupFrom, feePayer, feeNft, feeTopup, fee, creatorFee, takerFee,
      creatorPays: round(creatorFee + (topupFrom === "creator" ? topup : 0)),
      takerPays: round(takerFee + (topupFrom === "taker" ? topup : 0)),
    };
  }
  const minBid = (l) => (l.bids && l.bids.length ? ceil2(l.price * (1 + C.AUCTION_MIN_STEP_PERCENT / 100)) : l.startPrice);
  const dealLink = (id) => `https://t.me/${C.BOT_USERNAME}/${C.APP_SHORT_NAME}?startapp=deal_${id}`;

  /* ---------------- РЕАЛЬНИЙ БЕКЕНД ---------------- */
  async function request(method, path, body) {
    let res;
    try {
      res = await fetch(C.API_BASE.replace(/\/+$/, "") + path, {
        method,
        headers: { "Content-Type": "application/json", Authorization: "tma " + TG.initData, "Accept-Language": I18N.lang },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) { throw new Error(t("err.network")); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Server error (" + res.status + ")");
    return data;
  }
  const qs = (p) => new URLSearchParams(Object.entries(p).filter(([, v]) => v !== "" && v != null && !(Array.isArray(v) && !v.length)).map(([k, v]) => [k, Array.isArray(v) ? v.join(",") : v]));

  const real = {
    stats: () => request("GET", "/stats"),
    recentSales: () => request("GET", "/sales/recent"),
    catalog: () => request("GET", "/catalog"),                         // { collections:[{id,name}], backdrops:[{name,colors}] } — УСІ, навіть без лотів
    facets: (p = {}) => request("GET", "/listings/facets?" + qs(p)),   // { collections:{id:count}, backdrops:{name:count} }
    // p: mode(fixed|auction), q, collections[], backdrops[], sort(random|cheap|expensive), currency, min, max, seed
    listings: (p = {}) => request("GET", "/listings?" + qs(p)),
    listing: (id) => request("GET", "/listings/" + id),
    createListing: (data) => request("POST", "/listings", data),      // { giftSlug, type, price, currency, allowOffers, minOffer, durationH }
    cancelListing: (id) => request("DELETE", "/listings/" + id),
    placeBid: (id, amount) => request("POST", "/listings/" + id + "/bids", { amount }), // → { payUrl } — ставка заморожується
    myBids: () => request("GET", "/me/bids"),
    makeOffer: (id, amount) => request("POST", "/listings/" + id + "/offers", { amount }),
    offers: () => request("GET", "/offers"),                           // { incoming:[], outgoing:[] }
    offerAction: (id, action, price) => request("POST", "/offers/" + id + "/" + action, { price }), // accept|decline|counter|cancel
    createDeal: (listingId) => request("POST", "/deals", { listing_id: listingId }),
    createPrivateDeal: (data) => request("POST", "/deals/private", data),
    deals: (role) => request("GET", "/deals?role=" + role),
    deal: (id) => request("GET", "/deals/" + id),
    dealAction: (id, action) => request("POST", "/deals/" + id + "/" + action), // accept|sent|dispute|cancel
    myGifts: () => request("GET", "/me/gifts"),
    myListings: () => request("GET", "/me/listings"),
    profile: () => request("GET", "/me"),
    events: () => request("GET", "/me/events"),                        // нові події: перебили ставку, нова пропозиція…
    poll: () => request("GET", "/me/poll"),                            // події + лічильники одним запитом (економить ліміт сервера)
    // Обміни
    createExchange: (data) => request("POST", "/exchanges", data),
    exchangeInvites: () => request("GET", "/exchanges/invites"),
    startExchange: (id, giftSlug, topup) => request("POST", "/exchanges/" + id + "/start", { giftSlug, topup }), // доплату обирає той, хто починає → swap з payUrl
    swaps: () => request("GET", "/swaps"),
    swap: (id) => request("GET", "/swaps/" + id),
    swapAction: (id, action) => request("POST", "/swaps/" + id + "/" + action),   // pay|safe_sent|taker_sent|cancel|dispute
  };

  /* ---------------- ДЕМО-РЕЖИМ ---------------- */
  const DB = () => window.MOCK_DB;
  const ME = () => TG.user.id;
  const MIN = 60000, H = 3600000;
  const USD_RATE = { GRAM: 2, USDT: 1 };
  const newId = (p) => p + "-" + Math.floor(1000 + Math.random() * 9000);
  const meUser = () => ({ id: ME(), username: TG.user.username || "you", name: TG.user.first_name, deals: 0, rating: 5 });
  const emit = (type, data) => DB().events.push({ type, ...data, at: Date.now() });
  const nftOf = (g) => g.collection + " #" + g.number;

  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* ----- угоди ----- */
  function setStatus(deal, status, deadlineMin) {
    deal.status = status;
    deal.history.push({ status, at: Date.now() });
    deal.deadline = deadlineMin ? Date.now() + deadlineMin * MIN : null;
    if (status === "completed") { // лот продано — прибираємо
      const db = DB();
      db.listings = db.listings.filter((x) => x.id !== deal.listingId || x.type === "auction");
      db.myListings = db.myListings.filter((x) => x.id !== deal.listingId);
    }
  }
  function markPaid(deal) { // погоджена угода (приватна/торг/аукціон) одразу переходить до відправки
    setStatus(deal, "paid", C.ACCEPT_TIMEOUT_MIN);
    if (deal.agreed) setStatus(deal, "accepted", C.SEND_TIMEOUT_MIN);
  }
  function release(deal) {
    const l = DB().listings.find((x) => x.id === deal.listingId);
    if (l) l.reserved = false;
    if (deal.source === "private" && deal.role === "seller" && !DB().myGifts.some((g) => g.slug === deal.gift.slug)) DB().myGifts.unshift({ ...deal.gift, canTransfer: true });
  }
  function tickDeal(deal) {
    if (!deal.deadline || Date.now() < deal.deadline) return;
    if (deal.status === "awaiting_payment") { setStatus(deal, "cancelled"); release(deal); }
    else if (deal.status === "paid" || deal.status === "accepted") { setStatus(deal, "refunded"); release(deal); }
  }
  function simulateSeller(deal) {
    if (!deal.agreed) setTimeout(() => { if (deal.status === "paid") setStatus(deal, "accepted", C.SEND_TIMEOUT_MIN); }, 4000);
    setTimeout(() => { if (deal.status === "accepted") setStatus(deal, "sent"); }, 9000);
    setTimeout(() => { if (deal.status === "sent") setStatus(deal, "completed"); }, 13000);
  }
  function newDeal(o) {
    const f = calcFee(o.price, o.feePayer || C.DEFAULT_FEE_PAYER);
    const d = {
      id: newId("D"), private: o.source === "private", agreed: o.source !== "market", payUrl: "https://t.me/send?start=IVdemo",
      createdAt: Date.now(),
      status: "awaiting_payment", deadline: Date.now() + (o.source === "private" ? C.PRIVATE_PAY_TIMEOUT_MIN : C.PAY_TIMEOUT_MIN) * MIN,
      history: [{ status: "awaiting_payment", at: Date.now() }],
      ...o, ...f,
    };
    DB().deals.unshift(d);
    return d;
  }

  /* ----- аукціони ----- */
  function finalizeAuction(l) {
    l.status = "ended";
    const win = l.bids[l.bids.length - 1];
    const me = ME();
    const iSell = l.seller.id === me;
    if (!win) {
      if (iSell) { DB().myGifts.unshift({ ...l.gift, canTransfer: true }); DB().myListings = DB().myListings.filter((x) => x.id !== l.id); emit("noBids", { nft: nftOf(l.gift) }); }
      return;
    }
    l.winner = win;
    const iWon = win.userId === me;
    if (iWon || iSell) {
      // гроші переможця вже заморожені → угода одразу «очікує відправки»
      const d = newDeal({
        listingId: l.id, role: iWon ? "buyer" : "seller", source: "auction", gift: l.gift, price: win.amount, currency: l.currency, feePayer: l.feePayer,
        counterpart: iWon ? l.seller : { id: win.userId, username: win.username },
      });
      markPaid(d);
      if (iWon) { simulateSeller(d); emit("won", { nft: nftOf(l.gift), dealId: d.id }); }
      else { DB().myListings = DB().myListings.filter((x) => x.id !== l.id); emit("sold", { nft: nftOf(l.gift), sum: win.amount, currency: l.currency, dealId: d.id }); }
    } else if (l.bids.some((b) => b.userId === me)) {
      emit("lost", { nft: nftOf(l.gift) });
    }
  }
  function botBid(l, user) {
    if (l.status !== "active") return;
    const amount = minBid(l);
    const prevLeader = l.bids[l.bids.length - 1];
    l.bids.push({ userId: user.id, username: user.username, amount, at: Date.now() });
    l.price = amount;
    if (l.endsAt - Date.now() < C.AUCTION_ANTI_SNIPE_SEC * 1000) l.endsAt = Date.now() + C.AUCTION_ANTI_SNIPE_SEC * 1000;
    if (prevLeader && prevLeader.userId === ME()) emit("outbid", { nft: nftOf(l.gift), listingId: l.id });
    if (l.seller.id === ME()) emit("newBid", { nft: nftOf(l.gift), sum: amount, currency: l.currency });
  }

  /* ----- торг ----- */
  function acceptOffer(o, price) {
    const l = DB().listings.find((x) => x.id === o.listingId);
    o.status = "accepted";
    if (l) l.reserved = true;
    // інші активні пропозиції на цей лот закриваються
    DB().offers.forEach((x) => { if (x !== o && x.listingId === o.listingId && ["pending", "countered"].includes(x.status)) x.status = "declined"; });
    const d = newDeal({
      listingId: o.listingId, role: o.role, source: "offer", gift: o.gift, price, currency: o.currency, counterpart: o.counterpart, feePayer: l ? l.feePayer : undefined,
    });
    o.dealId = d.id;
    if (o.role === "seller") setTimeout(() => { if (d.status === "awaiting_payment") markPaid(d); }, 6000); // демо: покупець оплачує
    return d;
  }
  function simulateSellerReply(o) {
    setTimeout(() => {
      if (o.status !== "pending") return;
      const l = DB().listings.find((x) => x.id === o.listingId);
      if (!l || l.reserved) { o.status = "declined"; return emit("offerDeclined", { nft: nftOf(o.gift) }); }
      const r = o.amount / o.listPrice;
      if (r >= 0.9) { const d = acceptOffer(o, o.amount); emit("offerAccepted", { nft: nftOf(o.gift), dealId: d.id }); }
      else if (r >= 0.6) { o.status = "countered"; o.counter = round((o.amount + o.listPrice) / 2); emit("offerCountered", { nft: nftOf(o.gift), sum: o.counter, currency: o.currency }); }
      else { o.status = "declined"; emit("offerDeclined", { nft: nftOf(o.gift) }); }
    }, 5000);
  }
  function simulateIncomingOffer(l) {
    setTimeout(() => {
      if (!DB().listings.includes(l) || l.reserved) return;
      const buyer = { id: 3001, username: "buyer_max", name: "Макс" };
      const amount = round(Math.max(l.minOffer || 0, l.price * 0.85));
      DB().offers.unshift({ id: newId("O"), role: "seller", listingId: l.id, gift: l.gift, listPrice: l.price, currency: l.currency, amount, status: "pending", counterpart: buyer, createdAt: Date.now() });
      emit("offerNew", { nft: nftOf(l.gift), sum: amount, currency: l.currency });
    }, 8000);
  }


  /* ----- обміни (сейф) ----- */
  // Статуси: awaiting_payment → awaiting_safe → awaiting_taker → verifying → completed
  //          ↘ cancelled (не оплатили / автор не поклав NFT у сейф)
  //          ↘ returned  (друга сторона не надіслала NFT — сейф повертає NFT автору)
  //          ↘ dispute
  function setSwap(sw, status, deadlineMin) {
    sw.status = status;
    sw.history.push({ status, at: Date.now() });
    sw.deadline = deadlineMin ? Date.now() + deadlineMin * MIN : null;
  }
  function swapMyRole(sw) { return sw.role; }
  function maybeAllPaid(sw) {
    if (sw.status === "awaiting_payment" && sw.paid.creator && sw.paid.taker) {
      setSwap(sw, "awaiting_safe", C.SWAP_SAFE_TIMEOUT_MIN);
      if (sw.role === "taker") setTimeout(() => { // демо: автор кладе NFT у сейф
        if (sw.status !== "awaiting_safe") return;
        setSwap(sw, "awaiting_taker", C.SWAP_SEND_TIMEOUT_MIN);
        emit("swapSafe", { nft: nftOf(sw.gift) });
      }, 4000);
    }
  }
  function finishSwap(sw) {
    setSwap(sw, "completed");
    const db = DB();
    const l = db.listings.find((x) => x.id === sw.listingId);
    if (l) l.status = "done";
    db.listings = db.listings.filter((x) => x.id !== sw.listingId);
    db.myListings = db.myListings.filter((x) => x.id !== sw.listingId);
    // автор отримав NFT другої сторони, друга сторона — NFT із сейфа
    const got = sw.role === "creator" ? sw.takerGift : sw.gift;
    db.myGifts.unshift({ ...got, canTransfer: true });
    emit("swapDone", { nft: nftOf(got) });
  }
  function failSwap(sw, status) {
    setSwap(sw, status);
    const db = DB();
    const l = db.listings.find((x) => x.id === sw.listingId);
    if (l) l.status = "open"; // обмін знову доступний
    if (sw.role === "taker") db.myGifts.unshift({ ...sw.takerGift, canTransfer: true });
  }
  function tickSwap(sw) {
    if (!sw.deadline || Date.now() < sw.deadline) return;
    if (sw.status === "awaiting_payment" || sw.status === "awaiting_safe") failSwap(sw, "cancelled");
    else if (sw.status === "awaiting_taker") failSwap(sw, "returned");
  }
  // topup — доплата, яку обрав той, хто починає обмін (платить він, отримує автор)
  function createSwap(l, taker, takerGift, role, topup = 0) {
    const f = calcSwap(l.value, topup, l.feePayer, topup > 0 ? "taker" : null);
    const sw = {
      id: newId("S"), listingId: l.id, role, visibility: l.visibility, gift: l.gift, takerGift, currency: l.currency,
      creator: { id: l.seller.id, username: l.seller.username }, taker: { id: taker.id, username: taker.username },
      counterpart: role === "creator" ? { id: taker.id, username: taker.username } : { id: l.seller.id, username: l.seller.username },
      ...f, paid: { creator: f.creatorPays === 0, taker: f.takerPays === 0 }, payUrl: "https://t.me/send?start=IVdemo",
      status: "awaiting_payment", createdAt: Date.now(), deadline: Date.now() + C.SWAP_PAY_TIMEOUT_MIN * MIN,
      history: [{ status: "awaiting_payment", at: Date.now() }],
    };
    l.status = "in_progress";
    DB().swaps.unshift(sw);
    // демо: друга сторона одразу оплачує свою частину
    if (role === "taker") sw.paid.creator = true; else sw.paid.taker = true;
    maybeAllPaid(sw);
    return sw;
  }
  function simulateTaker(l) {
    setTimeout(() => {
      if (l.status !== "open" || !DB().listings.includes(l)) return;
      const u = DB().USERS[3];
      const cols = l.want.collections.length ? l.want.collections : null;
      const col = cols ? DB().COLLECTIONS.find((c) => c.id === cols[0]) : undefined;
      const tp = round(l.value * 0.1); // демо: друга сторона пропонує доплату 10%
      createSwap(l, u, DB().makeGift(col), "creator", tp);
      emit("exStartedTopup", { nft: nftOf(l.gift), u: u.username, sum: tp, currency: l.currency });
    }, 10000);
  }
  const wantOk = (l, g) => !l.want.collections.length || l.want.collections.includes(g.collectionId);

  // «Сервер» демо-режиму: кожну секунду закриває аукціони й прострочені угоди
  setInterval(() => {
    const db = DB();
    if (!db) return;
    db.listings.forEach((l) => { if (l.type === "auction" && l.status === "active" && Date.now() >= l.endsAt) finalizeAuction(l); });
    db.deals.forEach(tickDeal);
    db.swaps.forEach(tickSwap);
  }, 1000);

  /* ----- фільтрація ----- */
  function filterListings(p, skip = {}) {
    const query = (p.q || "").trim().toLowerCase().replace(/^#/, "");
    const mode = p.mode || "fixed";
    let items = DB().listings.filter((l) => !l.reserved && l.type === mode && (l.type !== "auction" || l.status === "active")
      && (l.type !== "exchange" || (l.visibility === "public" && l.status === "open")));
    if (query) {
      items = items.filter((l) => {
        const g = l.gift;
        return String(g.number) === query ||
          [g.collection, g.number, g.attrs.model.name, g.attrs.backdrop.name, g.attrs.symbol.name, l.seller.username].join(" ").toLowerCase().includes(query);
      });
    }
    if (!skip.collections && p.collections && p.collections.length) items = items.filter((l) => p.collections.includes(l.gift.collectionId));
    if (!skip.backdrops && p.backdrops && p.backdrops.length) items = items.filter((l) => p.backdrops.includes(l.gift.attrs.backdrop.name));
    if (p.currency && p.currency !== "all") {
      items = items.filter((l) => l.currency === p.currency);
      if (p.min !== "" && p.min != null) items = items.filter((l) => l.price >= +p.min);
      if (p.max !== "" && p.max != null) items = items.filter((l) => l.price <= +p.max);
    }
    return items;
  }
  const withMeta = (l) => {
    const o = clone(l);
    if (l.type === "auction") { o.minBid = minBid(l); o.leaderId = l.bids.length ? l.bids[l.bids.length - 1].userId : null; }
    if (l.type === "exchange") Object.assign(o, calcSwap(l.value, l.topup, l.feePayer, l.topupFrom));
    else Object.assign(o, calcFee(l.price, l.feePayer || C.DEFAULT_FEE_PAYER), { price: l.price });
    return o;
  };

  const mock = {
    async stats() {
      await sleep(60);
      const act = DB().listings.filter((l) => !l.reserved && (l.type !== "auction" || l.status === "active"));
      const ex = DB().listings.filter((l) => l.type === "exchange" && l.visibility === "public" && l.status === "open").length;
      return { listings: act.filter((l) => l.type !== "exchange").length, auctions: act.filter((l) => l.type === "auction").length, exchanges: ex, deals24h: DB().stats.deals24h };
    },
    async recentSales() { await sleep(60); return clone(DB().recentSales); },
    async catalog() { await sleep(60); return clone({ collections: DB().COLLECTIONS, backdrops: DB().BACKDROPS }); },

    async facets(p = {}) {
      await sleep(70);
      const count = (items, get) => items.reduce((m, l) => (m[get(l)] = (m[get(l)] || 0) + 1, m), {});
      return {
        collections: count(filterListings(p, { collections: true }), (l) => l.gift.collectionId),
        backdrops: count(filterListings(p, { backdrops: true }), (l) => l.gift.attrs.backdrop.name),
      };
    },

    async listings(p = {}) {
      await sleep(200);
      const items = filterListings(p);
      const usd = (l) => l.price * USD_RATE[l.currency];
      if (p.sort === "cheap") items.sort((a, b) => usd(a) - usd(b));
      else if (p.sort === "expensive") items.sort((a, b) => usd(b) - usd(a));
      else items.sort((a, b) => hash(a.id + p.seed) - hash(b.id + p.seed));
      return items.map(withMeta);
    },

    async listing(id) {
      await sleep(80);
      const l = DB().listings.find((x) => x.id === id);
      if (!l) throw err("err.lotNotFound");
      const o = withMeta(l);
      const my = DB().offers.find((x) => x.role === "buyer" && x.listingId === id && ["pending", "countered"].includes(x.status));
      if (my) o.myOffer = clone(my);
      return o;
    },

    async createListing({ giftSlug, type = "fixed", price, currency, allowOffers, minOffer, durationH, feePayer = C.DEFAULT_FEE_PAYER }) {
      await sleep(450);
      const idx = DB().myGifts.findIndex((g) => g.slug === giftSlug);
      if (idx === -1) throw err("err.notInProfile");
      const gift = DB().myGifts[idx];
      if (!gift.canTransfer) throw err("err.cantTransfer");
      const p = Number(price);
      if (!(p >= C.MIN_PRICE[currency]) || p > C.MAX_PRICE[currency]) throw err("err.badPrice");
      const base = { id: (type === "auction" ? "A" : "L") + Date.now(), type, gift, currency, seller: meUser(), feePayer, createdAt: Date.now() };
      let listing;
      if (type === "auction") {
        const h = Number(durationH);
        if (!(h >= 1 && h <= C.AUCTION_MAX_H)) throw err("err.badDuration");
        listing = { ...base, startPrice: round(p), price: round(p), bids: [], endsAt: Date.now() + h * H, status: "active" };
        // демо: інші користувачі роблять ставки
        [12000, 30000, 55000].forEach((ms, i) => setTimeout(() => botBid(listing, DB().USERS[i + 1]), ms));
      } else {
        const mo = minOffer ? Number(minOffer) : null;
        if (mo != null && !(mo > 0 && mo < p)) throw err("err.badPrice");
        listing = { ...base, price: round(p), allowOffers: !!allowOffers, minOffer: allowOffers && mo ? round(mo) : null };
        if (listing.allowOffers) simulateIncomingOffer(listing);
      }
      DB().myGifts.splice(idx, 1);
      DB().myListings.unshift(listing);
      DB().listings.unshift(listing);
      return withMeta(listing);
    },

    async cancelListing(id) {
      await sleep(250);
      const db = DB();
      const l = db.listings.find((x) => x.id === id);
      if (!l) throw err("err.lotNotFound");
      if (l.reserved) throw err("err.lotInDeal");
      if (l.type === "auction" && l.bids.length) throw err("err.auctionHasBids");
      if (l.type === "exchange" && l.status !== "open") throw err("err.lotInDeal");
      db.myListings = db.myListings.filter((x) => x.id !== id);
      db.listings = db.listings.filter((x) => x.id !== id);
      db.offers.forEach((o) => { if (o.listingId === id && ["pending", "countered"].includes(o.status)) o.status = "declined"; });
      db.myGifts.unshift(l.gift);
      return { ok: true };
    },

    /* ----- аукціон ----- */
    async placeBid(id, amount) {
      await sleep(350);
      const l = DB().listings.find((x) => x.id === id);
      if (!l || l.type !== "auction") throw err("err.lotNotFound");
      if (l.status !== "active" || Date.now() >= l.endsAt) throw err("err.auctionEnded");
      if (l.seller.id === ME()) throw err("err.ownAuction");
      const lead = l.bids[l.bids.length - 1];
      if (lead && lead.userId === ME()) throw err("err.alreadyLeader");
      const a = round(Number(amount));
      const mb = minBid(l);
      if (!(a >= mb)) throw err("err.bidLow", { v: mb + " " + l.currency });
      // Реально: бекенд створює рахунок Crypto Pay на (ставка + комісія); ставка активна після оплати.
      // Коли ставку перебивають — бекенд повертає кошти (transfer/check).
      l.bids.push({ userId: ME(), username: TG.user.username || "you", amount: a, at: Date.now() });
      l.price = a;
      if (l.endsAt - Date.now() < C.AUCTION_ANTI_SNIPE_SEC * 1000) l.endsAt = Date.now() + C.AUCTION_ANTI_SNIPE_SEC * 1000;
      // демо: конкурент може перебити
      l.botTries = (l.botTries || 0) + 1;
      if (l.botTries <= 2) setTimeout(() => {
        const last = l.bids[l.bids.length - 1];
        if (l.status === "active" && last.userId === ME() && Math.random() < 0.6) botBid(l, DB().USERS.find((u) => u.id !== l.seller.id));
      }, 5000 + Math.random() * 4000);
      return withMeta(l);
    },

    async myBids() {
      await sleep(150);
      const me = ME();
      return DB().listings
        .filter((l) => l.type === "auction" && l.bids.some((b) => b.userId === me))
        .map((l) => {
          const myBid = Math.max(...l.bids.filter((b) => b.userId === me).map((b) => b.amount));
          const lead = l.bids[l.bids.length - 1];
          const state = l.status === "active" ? (lead.userId === me ? "leading" : "outbid") : (l.winner && l.winner.userId === me ? "won" : "lost");
          return { listing: withMeta(l), myBid, state };
        })
        .sort((a, b) => (a.listing.status === "active" ? 0 : 1) - (b.listing.status === "active" ? 0 : 1) || a.listing.endsAt - b.listing.endsAt);
    },


    /* ----- обміни ----- */
    // Створити обмін: { giftSlug, visibility, targetUsername, wantCollections[], value, currency, topup, topupFrom, feePayer }
    // Доплату автор не задає — її обирає той, хто починає обмін (startExchange)
    async createExchange({ giftSlug, visibility = "public", targetUsername, wantCollections = [], value, currency, feePayer = "taker" }) {
      await sleep(450);
      const idx = DB().myGifts.findIndex((g) => g.slug === giftSlug);
      if (idx === -1) throw err("err.notInProfile");
      const gift = DB().myGifts[idx];
      if (!gift.canTransfer) throw err("err.cantTransfer");
      const v = Number(value);
      if (!(v >= C.MIN_PRICE[currency]) || v > C.MAX_PRICE[currency]) throw err("err.badValue");
      let target = null;
      if (visibility === "private") {
        target = String(targetUsername || "").replace(/^@/, "").trim();
        if (!/^[a-zA-Z0-9_]{4,32}$/.test(target)) throw err("err.username");
        if (TG.user.username && target.toLowerCase() === TG.user.username.toLowerCase()) throw err("err.self");
      }
      const l = {
        id: "X" + Date.now(), type: "exchange", visibility, targetUsername: target, gift, seller: meUser(), currency,
        want: { collections: wantCollections }, value: round(v), price: round(v), topup: 0, topupFrom: null,
        feePayer, status: "open", createdAt: Date.now(),
      };
      DB().myGifts.splice(idx, 1);
      DB().listings.unshift(l);
      DB().myListings.unshift(l);
      simulateTaker(l); // демо: хтось приймає обмін
      return withMeta(l);
    },

    // Приватні запрошення до обміну саме для мене
    async exchangeInvites() {
      await sleep(100);
      const me = (TG.user.username || "").toLowerCase();
      return DB().listings.filter((l) => l.type === "exchange" && l.visibility === "private" && l.status === "open" && (l.targetUsername || "").toLowerCase() === me).map(withMeta);
    },

    // Почати обмін (я — друга сторона): обираю свій NFT і, за бажання, доплату автору
    async startExchange(id, giftSlug, topup = 0) {
      await sleep(450);
      const l = DB().listings.find((x) => x.id === id);
      if (!l || l.type !== "exchange" || l.status !== "open") throw err("err.reserved");
      if (l.seller.id === ME()) throw err("err.ownLot");
      if (l.visibility === "private" && (l.targetUsername || "").toLowerCase() !== (TG.user.username || "").toLowerCase()) throw err("err.notForYou");
      const idx = DB().myGifts.findIndex((g) => g.slug === giftSlug);
      if (idx === -1) throw err("err.pickNft");
      const g = DB().myGifts[idx];
      if (!g.canTransfer) throw err("err.cantTransfer");
      if (!wantOk(l, g)) throw err("err.wantMismatch");
      const tp = round(Number(topup) || 0);
      if (tp < 0) throw err("err.badTopup");
      DB().myGifts.splice(idx, 1);
      // Реально: бекенд перевіряє обидва NFT (власник, can_be_transferred / next_transfer_date),
      // створює рахунки Crypto Pay на частину комісії й доплату кожної сторони.
      return clone(createSwap(l, meUser(), g, "taker", tp));
    },

    async swaps() {
      await sleep(130);
      DB().swaps.forEach(tickSwap);
      return clone(DB().swaps);
    },

    async swap(id) {
      await sleep(40);
      const sw = DB().swaps.find((x) => x.id === id);
      if (!sw) throw err("err.dealNotFound");
      tickSwap(sw);
      return clone(sw);
    },

    // action: pay | safe_sent | taker_sent | cancel | dispute
    async swapAction(id, action) {
      await sleep(280);
      const sw = DB().swaps.find((x) => x.id === id);
      if (!sw) throw err("err.dealNotFound");
      const me = sw.role;
      switch (action) {
        case "pay": // ДЕМО: реально «оплачено» ставить вебхук Crypto Pay
          if (sw.status !== "awaiting_payment" || sw.paid[me]) throw err("err.alreadyPaid");
          sw.paid[me] = true; sw.history.push({ status: "paid_" + me, at: Date.now() });
          maybeAllPaid(sw);
          break;
        case "safe_sent": // автор: «надіслав у сейф» (реально бот сам бачить подарунок на бізнес-акаунті)
          if (me !== "creator" || sw.status !== "awaiting_safe") throw err("err.unknown");
          setSwap(sw, "awaiting_taker", C.SWAP_SEND_TIMEOUT_MIN);
          setTimeout(() => { if (sw.status === "awaiting_taker") setSwap(sw, "verifying"); }, 6000); // демо: друга сторона надсилає
          setTimeout(() => { if (sw.status === "verifying") finishSwap(sw); }, 9500);
          break;
        case "taker_sent": // друга сторона: «надіслав NFT автору» → бот перевіряє профіль автора
          if (me !== "taker" || sw.status !== "awaiting_taker") throw err("err.unknown");
          setSwap(sw, "verifying");
          setTimeout(() => { if (sw.status === "verifying") finishSwap(sw); }, 3500);
          break;
        case "cancel":
          if (sw.status !== "awaiting_payment") throw err("err.cantCancel");
          failSwap(sw, "cancelled");
          break;
        case "dispute":
          if (!["awaiting_taker", "verifying"].includes(sw.status)) throw err("err.cantDispute");
          setSwap(sw, "dispute");
          break;
        default: throw err("err.unknown");
      }
      return clone(sw);
    },

    /* ----- торг ----- */
    async makeOffer(id, amount) {
      await sleep(350);
      const l = DB().listings.find((x) => x.id === id);
      if (!l || l.reserved) throw err("err.reserved");
      if (l.type !== "fixed" || !l.allowOffers) throw err("err.noOffers");
      if (l.seller.id === ME()) throw err("err.ownLot");
      if (DB().offers.some((o) => o.role === "buyer" && o.listingId === id && ["pending", "countered"].includes(o.status))) throw err("err.offerExists");
      const a = round(Number(amount));
      if (!(a > 0)) throw err("err.badPrice");
      if (a >= l.price) throw err("err.offerHigh");
      if (l.minOffer && a < l.minOffer) throw err("err.minOffer", { v: l.minOffer + " " + l.currency });
      const o = { id: newId("O"), role: "buyer", listingId: id, gift: l.gift, listPrice: l.price, currency: l.currency, amount: a, status: "pending", counterpart: l.seller, createdAt: Date.now() };
      DB().offers.unshift(o);
      simulateSellerReply(o);
      return clone(o);
    },

    async offers() {
      await sleep(150);
      const all = DB().offers;
      return { incoming: clone(all.filter((o) => o.role === "seller")), outgoing: clone(all.filter((o) => o.role === "buyer")) };
    },

    async offerAction(id, action, price) {
      await sleep(300);
      const o = DB().offers.find((x) => x.id === id);
      if (!o) throw err("err.lotNotFound");
      const l = DB().listings.find((x) => x.id === o.listingId);
      if (o.role === "buyer") {
        if (action === "cancel" && o.status === "pending") o.status = "cancelled";
        else if (action === "decline" && o.status === "countered") o.status = "declined";
        else if (action === "accept" && o.status === "countered") {
          if (!l || l.reserved) throw err("err.reserved");
          acceptOffer(o, o.counter);
        } else throw err("err.unknown");
      } else {
        if (o.status !== "pending") throw err("err.unknown");
        if (action === "decline") o.status = "declined";
        else if (action === "accept") {
          if (!l || l.reserved) throw err("err.lotInDeal");
          acceptOffer(o, o.amount);
        } else if (action === "counter") {
          const p = round(Number(price));
          if (!(p > o.amount && p < o.listPrice)) throw err("err.counterRange");
          o.status = "countered"; o.counter = p;
          setTimeout(() => { // демо: покупець відповідає
            if (o.status !== "countered") return;
            const ll = DB().listings.find((x) => x.id === o.listingId);
            if (ll && !ll.reserved && Math.random() < 0.65) { acceptOffer(o, o.counter); emit("buyerAccepted", { nft: nftOf(o.gift) }); }
            else { o.status = "declined"; emit("buyerDeclined", { nft: nftOf(o.gift) }); }
          }, 6000);
        } else throw err("err.unknown");
      }
      return clone(o);
    },

    /* ----- угоди ----- */
    async createDeal(listingId) {
      await sleep(450);
      const l = DB().listings.find((x) => x.id === listingId);
      if (!l || l.reserved || l.type !== "fixed") throw err("err.reserved");
      if (l.seller.id === ME()) throw err("err.ownLot");
      l.reserved = true;
      return clone(newDeal({ listingId: l.id, role: "buyer", source: "market", gift: l.gift, price: l.price, currency: l.currency, counterpart: l.seller, feePayer: l.feePayer }));
    },

    async createPrivateDeal({ buyerUsername, giftSlug, price, currency, feePayer = C.DEFAULT_FEE_PAYER }) {
      await sleep(450);
      const u = String(buyerUsername || "").replace(/^@/, "").trim();
      if (!/^[a-zA-Z0-9_]{4,32}$/.test(u)) throw err("err.username");
      if (TG.user.username && u.toLowerCase() === TG.user.username.toLowerCase()) throw err("err.self");
      const idx = DB().myGifts.findIndex((g) => g.slug === giftSlug);
      if (idx === -1) throw err("err.notInProfile");
      if (!DB().myGifts[idx].canTransfer) throw err("err.cantTransfer");
      const p = Number(price);
      if (!(p >= C.MIN_PRICE[currency]) || p > C.MAX_PRICE[currency]) throw err("err.badPrice");
      const gift = DB().myGifts.splice(idx, 1)[0];
      const d = newDeal({ role: "seller", source: "private", gift, price: p, currency, counterpart: { username: u }, feePayer });
      d.link = dealLink(d.id);
      setTimeout(() => { if (d.status === "awaiting_payment") markPaid(d); }, 8000); // демо: покупець оплачує
      return clone(d);
    },

    async deals(role) {
      await sleep(130);
      DB().deals.forEach(tickDeal);
      return clone(DB().deals.filter((d) => d.role === role));
    },

    async deal(id) {
      await sleep(40);
      const d = DB().deals.find((x) => x.id === id);
      if (!d) throw err("err.dealNotFound");
      tickDeal(d);
      return clone({ ...d, link: d.link || dealLink(d.id) });
    },

    async dealAction(id, action) {
      await sleep(280);
      const d = DB().deals.find((x) => x.id === id);
      if (!d) throw err("err.dealNotFound");
      switch (action) {
        case "pay": // ДЕМО: у реальності статус «paid» ставить бекенд після вебхука Crypto Pay
          if (d.status !== "awaiting_payment") throw err("err.alreadyPaid");
          markPaid(d);
          simulateSeller(d);
          break;
        case "accept":
          if (d.role !== "seller" || d.status !== "paid") throw err("err.cantAccept");
          setStatus(d, "accepted", C.SEND_TIMEOUT_MIN);
          break;
        case "sent":
          if (d.role !== "seller" || d.status !== "accepted") throw err("err.acceptFirst");
          setStatus(d, "sent");
          setTimeout(() => { if (d.status === "sent") setStatus(d, "completed"); }, 5000);
          break;
        case "cancel":
          if (d.status !== "awaiting_payment" || (d.role === "seller" && !d.agreed)) throw err("err.cantCancel");
          setStatus(d, "cancelled");
          release(d);
          break;
        case "dispute":
          if (!["paid", "accepted", "sent"].includes(d.status)) throw err("err.cantDispute");
          setStatus(d, "dispute");
          break;
        default:
          throw err("err.unknown");
      }
      return clone(d);
    },

    async myGifts() { await sleep(180); return clone(DB().myGifts); },
    async myListings() { await sleep(110); return DB().myListings.map(withMeta); },

    async profile() {
      await sleep(90);
      const deals = DB().deals;
      return {
        user: TG.user,
        stats: {
          sold: deals.filter((d) => d.role === "seller" && d.status === "completed").length,
          bought: deals.filter((d) => d.role === "buyer" && d.status === "completed").length,
          rating: 5.0,
        },
      };
    },

    async events() { const e = DB().events.splice(0); return e; },
  };

  window.API = C.MOCK ? mock : real;
  window.API.calcFee = calcFee;
  window.API.calcSwap = calcSwap;
  window.API.dealLink = dealLink;
})();

</script>
  <script>/* ===== js/ui.js ===== */
/* =========================================================
   UI-хелпери: форматування, іконки, арт NFT, тости, шторка,
   конфеті, частинки фону, анімація лічильників
   ========================================================= */
(function () {
  const C = window.CONFIG;

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const ICONS = {
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    bolt: '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
    wallet: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
    alert: '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
    chat: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>',
    book: '<svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4V4Zm16 0h-4a3 3 0 0 0-3 3"/><path d="M20 4v14h-6"/></svg>',
    chev: '<svg viewBox="0 0 24 24" class="chev"><path d="m9 6 6 6-6 6"/></svg>',

  // Іконки валют (власні, без брендових логотипів)
  function curIcon(code) {
    if (code === "USDT")

    return '<svg class="cur-icon" viewBox="0 0 24 24" style="stroke:none"><circle cx="12" cy="12" r="11" fill="#ff1f45"/><path d="M7 8h10l-5 9-5-9Zm5 0v9" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>';
  }

  function fmtNum(n, cur) {
    const d = (C.CURRENCIES[cur] && C.CURRENCIES[cur].decimals) ?? 2;
    return Number(n).toLocaleString(I18N.locale, { minimumFractionDigits: 0, maximumFractionDigits: d });
  }
  const fmtSum = (n, cur) => fmtNum(n, cur) + " " + cur;
  function price(n, cur, big) {
    return `<span class="price ${big ? "price--lg" : ""}">${curIcon(cur)}${fmtNum(n, cur)}</span>`;
  }

  // Арт NFT: картинка, якщо є, інакше емодзі на градієнті фону
  function nftArt(gift, size = "", extra = "") {
    const [a, b] = gift.colors || ["#ff1f45", "#40000d"];
    const inner = gift.imageUrl
      ? `<img src="${esc(gift.imageUrl)}" alt="${esc(gift.collection)}" loading="lazy" />`
      : `<span class="nft-art__icon">${GI.gift(gift.collectionId)}</span>`;
    return `<div class="nft-art ${size ? "nft-art--" + size : ""}" style="--art-a:${a};--art-b:${b}">${inner}${extra}</div>`;
  }

  const STATUS_CLS = {
    awaiting_payment: "warn", paid: "red", accepted: "info", sent: "info",
    completed: "ok", refunded: "muted", cancelled: "muted", dispute: "warn",
  };
  const badge = (status) => `<span class="badge badge--${STATUS_CLS[status] || "muted"}">${t("status." + status)}</span>`;

  function timeAgo(ts) {
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return t("time.now");
    if (m < 60) return t("time.min", { n: m });
    const h = Math.floor(m / 60);
    if (h < 24) return t("time.hour", { n: h });
    return t("time.day", { n: Math.floor(h / 24) });
  }
  // Зворотний відлік: 2д 5год · 3:04:09 · 04:09
  function countdown(deadline) {
    const s = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (d) return `${d}${t("u.d")} ${h}${t("u.h")}`;
    const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  const fmtDur = (h) => (h >= 24 && h % 24 === 0 ? t("dur.d", { n: h / 24 }) : t("dur.h", { n: h }));

  // Власна іконка замість емодзі: ei("flame"), ei("crown", "ei--sm")
  const ei = (name, cls = "") => GI.ui(name, cls);

  function toast(text, type = "", icon) {
    const wrap = document.getElementById("toasts");
    const el = document.createElement("div");
    el.className = "toast " + (type ? "toast--" + type : "");
    el.innerHTML = `<span class="toast__ic">${ei(icon || (type === "ok" ? "ok" : type === "err" ? "err" : "bell"))}</span><span class="toast__t"></span>`;
    el.querySelector(".toast__t").textContent = text;
    wrap.appendChild(el);
    TG.haptic(type === "err" ? "error" : type === "ok" ? "success" : "light");
    setTimeout(() => el.classList.add("toast--out"), 2600);
    setTimeout(() => el.remove(), 3000);
  }

  // Нижня шторка
  let onSheetClose = null;
  const sheetChrome = () => `<div class="sheet__handle"></div><button class="sheet__close" data-action="close-sheet" aria-label="close">${ICONS.close}</button>`;
  function openSheet(html, onClose) {
    const layer = document.getElementById("sheet-layer");
    const prevCb = onSheetClose; onSheetClose = null;
    if (!layer.hidden && prevCb) prevCb(); // заміна однієї шторки іншою
    const sheet = document.getElementById("sheet");
    sheet.innerHTML = sheetChrome() + html;
    sheet.scrollTop = 0;
    layer.hidden = false;
    document.body.style.overflow = "hidden";
    onSheetClose = onClose || null;
    TG.showBack(closeSheet);
  }
  function setSheet(html) { document.getElementById("sheet").innerHTML = sheetChrome() + html; }
  function closeSheet() {
    const layer = document.getElementById("sheet-layer");
    if (layer.hidden) return;
    layer.hidden = true;
    document.body.style.overflow = "";
    TG.hideBack();
    const cb = onSheetClose; onSheetClose = null;
    if (cb) cb();
  }
  const sheetOpen = () => !document.getElementById("sheet-layer").hidden;

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Конфеті при завершенні угоди
  function confetti() {
    if (reduced) return;
    const box = document.createElement("div");
    box.className = "confetti";
    const colors = ["#ff1f45", "#ffffff", "#ff4f8b", "#ffb547", "#e3002b"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.5 + "s";
      p.style.animationDuration = 1.8 + Math.random() * 1.4 + "s";
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
      if (i % 3 === 0) p.style.borderRadius = "50%";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3800);
  }

  // Частинки фону: червоні трикутники й кристали, що повільно пливуть угору
  function particles() {
    const host = document.getElementById("particles");
    if (!host || reduced) return;
    const shapes = ["tri", "gem", "dot"];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement("i");
      s.className = "particle particle--" + shapes[i % 3];
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = 14 + Math.random() * 16 + "s";
      s.style.animationDelay = -Math.random() * 30 + "s";
      s.style.setProperty("--size", 6 + Math.random() * 10 + "px");
      s.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
      host.appendChild(s);
    }
  }

  // Анімація числа від 0 до значення
  function countUp(el, to, ms = 900) {
    if (!el) return;
    if (reduced) { el.textContent = Number(to).toLocaleString(I18N.locale); return; }
    const start = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - start) / ms);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))).toLocaleString(I18N.locale);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  window.UI = { ei, esc, ICONS, curIcon, fmtNum, fmtSum, price, nftArt, badge, timeAgo, countdown, fmtDur, toast, openSheet, setSheet, closeSheet, sheetOpen, confetti, particles, countUp };
})();

</script>

    renderFilterBar();
