  <style>/* css/style.css */
/* =========================================================
   TrionGift — стиль у тематиці лого:
   чорний фон, червоний неон, діагональні промені, білий жирний шрифт
   ========================================================= */

:root {
  --bg: #050506;
  --bg-2: #0b0b0e;
  --card: #110d10;
  --card-2: #18101a;
  --line: rgba(255, 40, 70, 0.16);
  --line-strong: rgba(255, 40, 70, 0.42);

  --red: #ff1f45;
  --red-2: #e3002b;
  --red-deep: #8a0018;
  --pink: #ff4f8b;
  --red-glow: rgba(255, 31, 69, 0.55);

  --text: #ffffff;
  --text-2: #b9b0b4;
  --text-3: #6f666b;

  --ok: #2fe39a;
  --warn: #ffb547;
  --info: #66a8ff;

  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;

  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
  --tabbar-h: 74px;
  --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4;
  min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ---------- Фон ---------- */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg__glow {
  position: absolute; left: 50%; top: -18vh; width: 140vw; height: 70vh; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255, 20, 55, 0.32), rgba(255, 20, 55, 0.08) 55%, transparent 75%);
  animation: glowBreath 7s ease-in-out infinite;
}
@keyframes glowBreath { 50% { opacity: 0.65; transform: translateX(-50%) scale(1.06); } }
.bg__beam {
  position: absolute; width: 22px; height: 180vh; top: -40vh;
  background: linear-gradient(180deg, transparent, rgba(255, 30, 60, 0.55), transparent);
  transform: rotate(38deg); filter: blur(1px); opacity: 0.55;
  animation: beam 9s ease-in-out infinite;
}
.bg__beam--1 { left: 78%; }
.bg__beam--2 { left: 96%; width: 60px; opacity: 0.28; filter: blur(6px); animation-delay: -3s; }
.bg__beam--3 { left: -6%; top: 10vh; width: 40px; opacity: 0.22; filter: blur(5px); animation-delay: -6s; }
@keyframes beam { 50% { opacity: 0.18; } }

.bg__particles { position: absolute; inset: 0; }
.bg::after { content: ""; position: absolute; left: -30vw; bottom: -20vh; width: 90vw; height: 60vh; background: radial-gradient(closest-side, rgba(255, 60, 140, 0.13), transparent 70%); }
.particle {
  position: absolute; bottom: -20px; width: var(--size); height: var(--size); opacity: 0;
  animation: floatUp linear infinite;
}
.particle--tri { background: var(--red); clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: drop-shadow(0 0 6px var(--red)); }
.particle--gem { background: linear-gradient(135deg, #ff6b86, var(--red-2)); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); }
.particle--dot { background: #fff; border-radius: 50%; width: calc(var(--size) / 3); height: calc(var(--size) / 3); box-shadow: 0 0 8px #ff4f6d; }
@keyframes floatUp {
  0% { transform: translate(0, 0) rotate(0); opacity: 0; }
  10% { opacity: 0.55; }
  90% { opacity: 0.35; }
  100% { transform: translate(var(--drift), -110vh) rotate(260deg); opacity: 0; }
}

/* ---------- Каркас ---------- */
.app {
  position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding: calc(var(--safe-top) + 12px) 16px calc(var(--tabbar-h) + var(--safe-bottom) + 28px);
}
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.topbar__right { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand__mark {
  position: relative; width: 44px; height: 44px; border-radius: 13px; padding: 2px; flex: none; overflow: hidden;
  box-shadow: 0 0 18px var(--red-glow); animation: logoGlow 3.2s ease-in-out infinite;
}
.brand__mark::before { /* неонова рамка, що обертається */
  content: ""; position: absolute; inset: -50%;
  background: conic-gradient(from 0deg, transparent 0 55%, #ff1f45 70%, #fff 76%, #ff1f45 82%, transparent 100%);
  animation: rot 3.5s linear infinite;
}
.brand__logo { position: relative; width: 100%; height: 100%; border-radius: 11px; object-fit: cover; background: #050506; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes logoGlow { 50% { box-shadow: 0 0 30px var(--red); } }
.brand__text { display: flex; flex-direction: column; line-height: 1.1; }
.brand__name { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: 0.2px; }
.brand__name b { color: var(--red); font-weight: 800; text-shadow: 0 0 14px var(--red-glow); }
.brand__sub { font-size: 10.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1.6px; margin-top: 3px; }

.lang-pill {
  height: 36px; padding: 0 11px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
  background: var(--bg-2); border: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--text-2);
}
.lang-pill svg { width: 16px; height: 16px; color: var(--red); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: linear-gradient(145deg, #2a0710, #0d0d10); border: 1px solid var(--line-strong);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--xl { width: 64px; height: 64px; font-size: 24px; box-shadow: 0 0 22px var(--red-glow); border-color: var(--red); }

.screen { animation: fadeUp 0.32s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Типографіка ---------- */
.h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.15; margin: 0; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
.h2 svg { color: var(--red); width: 20px; height: 20px; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.accent { color: var(--red); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 12px; gap: 10px; }
.section-head .link { font-size: 13px; color: var(--red); font-weight: 800; }
.section-head .h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; flex: none; background: linear-gradient(var(--pink), var(--red-2)); box-shadow: 0 0 10px var(--red); }
.flame { display: inline-block; animation: flame 1.2s ease-in-out infinite; }
@keyframes flame { 50% { transform: scale(1.18) rotate(-6deg); filter: drop-shadow(0 0 6px #ff6a00); } }

.page-head { display: flex; gap: 12px; align-items: flex-start; }
.page-head__icon {
  width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--red), var(--red-2)); box-shadow: 0 0 22px var(--red-glow);
}
.page-head__icon svg { width: 22px; height: 22px; color: #fff; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line-strong);
  background: #0a0508; min-height: 196px; isolation: isolate;
  box-shadow: 0 0 40px rgba(255, 20, 55, 0.2);
}
.hero__img {
  position: absolute; right: -36px; top: 50%; height: 128%; width: auto; max-width: none; z-index: -2;
  transform: translateY(-50%); animation: heroFloat 9s ease-in-out infinite;
}
@keyframes heroFloat { 50% { transform: translateY(-53%) scale(1.04); } }
.hero::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: 2; pointer-events: none;
  background: conic-gradient(from var(--ang, 0deg), transparent 0 62%, rgba(255,31,69,0.9) 74%, #fff 80%, rgba(255,31,69,0.9) 86%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: ang 6s linear infinite;
}
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes ang { to { --ang: 360deg; } }
.hero__shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(105deg, rgba(5,5,6,0.97) 0%, rgba(5,5,6,0.88) 46%, rgba(5,5,6,0.05) 80%); }
.hero__shine {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  background-size: 250% 100%; animation: shine 6s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { background-position: 150% 0; } 100% { background-position: -100% 0; } }
.hero__content { padding: 20px 18px 16px; }
.hero__title { font-family: var(--font-display); font-weight: 900; font-size: 25px; line-height: 1.06; margin: 0 0 8px; max-width: 64%; }
.hero__title span { color: var(--red); text-shadow: 0 0 18px var(--red-glow); }
.hero__text { color: var(--text-2); font-size: 13px; max-width: 58%; margin: 0 0 14px; }
.hero__stats { display: flex; gap: 6px; }
.hero__stats > div {
  display: flex; flex-direction: column; padding: 7px 10px; border-radius: 12px; min-width: 0;
  background: rgba(10, 4, 7, 0.72); border: 1px solid var(--line); backdrop-filter: blur(6px);
}
.hero__stats b { font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.hero__stats span { font-size: 10.5px; color: var(--text-2); white-space: nowrap; }

/* ---------- Тікер продажів ---------- */
.ticker {
  margin-top: 12px; overflow: hidden; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255, 31, 69, 0.05);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.ticker__track { display: flex; gap: 22px; width: max-content; padding: 9px 0; animation: ticker 45s linear infinite; }
.ticker:hover .ticker__track { animation-play-state: paused; }
@keyframes ticker { to { transform: translateX(-50%); } }
.ticker__item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.ticker__item b { color: var(--text); }
.ticker__item i { font-style: normal; color: var(--text-3); font-size: 11px; }
.ticker__item .price { font-size: 12px; color: var(--text); }
.ticker__item .cur-icon { width: 13px; height: 13px; }
.ticker__item .nft-art--xs { width: 22px; height: 22px; border-radius: 6px; flex: none; }
.nft-art--xs::before { display: none; }
.nft-art--xs .nft-art__icon { width: 80%; height: 80%; filter: none; }

/* ---------- Сегменти, чіпи ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 6px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: rgba(255, 31, 69, 0.1); border: 1px solid var(--line);
}
.segment { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); margin-top: 14px; }
.segment__btn {
  flex: 1; padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .2s, background .2s;
}
.segment__btn .cur-icon { width: 16px; height: 16px; }
.segment__btn.is-active { background: linear-gradient(135deg, #ff4466, var(--red) 40%, var(--red-2)); color: #fff; box-shadow: 0 0 16px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.28); }
.segment__btn svg { width: 16px; height: 16px; }
.segment__btn .soon { font-size: 9px; padding: 2px 5px; border-radius: 6px; background: rgba(255,255,255,0.08); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
.seg-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #fff; color: var(--red-2); font-style: normal; font-size: 11px; font-weight: 900; display: inline-grid; place-items: center; }
.segment__btn:not(.is-active) .seg-badge { background: var(--red); color: #fff; }

/* ---------- Пошук ---------- */
.search {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 0 8px 0 14px; height: 48px;
  border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,31,69,0.14), 0 0 22px rgba(255,31,69,0.18); }
.search > svg { color: var(--text-3); width: 18px; height: 18px; flex: none; }
.search:focus-within > svg { color: var(--red); }
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; min-width: 0; }
.search input::placeholder { color: var(--text-3); }
.search__clear { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.06); flex: none; }
.search__clear svg { width: 15px; height: 15px; }

.chips-row { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: none; padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--text-2); transition: all .2s;
}
.filter-chip.is-active { color: #fff; border-color: var(--red); background: rgba(255, 31, 69, 0.16); box-shadow: 0 0 12px rgba(255,31,69,0.3); }

/* ---------- Панель фільтрів: Модель / Ціна / Фон ---------- */
.filter-bar { display: flex; gap: 8px; margin: 10px -16px 0; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.fbtn {
  flex: 1 0 auto; height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 5px;
  background: linear-gradient(165deg, var(--card-2), var(--card)); border: 1px solid var(--line);
  font-size: 13px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; transition: all .2s;
}
.fbtn__t { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.fbtn .caret { width: 15px; height: 15px; color: var(--text-3); flex: none; transition: transform .2s; }
.fbtn.is-on { border-color: var(--red); background: rgba(255, 31, 69, 0.14); box-shadow: 0 0 14px rgba(255,31,69,0.25); }
.fbtn.is-on .caret { color: var(--red); }
.fbtn__n { min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); font-size: 11px; display: inline-grid; place-items: center; padding: 0 4px; }
.fbtn--icon { flex: none; width: 40px; padding: 0; }
.fbtn--icon svg { width: 20px; height: 20px; color: var(--red); }
.fbtn--reset { flex: none; width: 40px; padding: 0; border-color: rgba(255,255,255,0.12); }
.fbtn--reset svg { width: 16px; height: 16px; }
.spin svg { animation: spin 0.6s var(--ease); }
@keyframes spin { to { transform: rotate(360deg) scale(1); } 50% { transform: rotate(180deg) scale(1.25); } }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.25); font-style: normal; }
.fbtn .dot + .dot { margin-left: -6px; }

/* ---------- Сітка NFT ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.nft-card {
  position: relative; text-align: left; border-radius: var(--r); overflow: hidden; cursor: pointer; outline: 0;
  border: 1px solid transparent;
  background:
    linear-gradient(165deg, #1a1016, var(--card) 60%) padding-box,
    linear-gradient(160deg, color-mix(in srgb, var(--art-a, #ff1f45) 75%, transparent), rgba(255,31,69,0.1) 45%, rgba(255,31,69,0.38)) border-box;
  transition: transform 0.18s var(--ease), border-color 0.18s, box-shadow 0.18s;
  animation: cardIn 0.45s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
.nft-card::after { /* блиск при наведенні/натисканні */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.12) 50%, transparent 65%);
  background-size: 250% 100%; background-position: 150% 0; transition: background-position 0.6s ease;
}
.nft-card:hover::after, .nft-card:active::after { background-position: -60% 0; }
.nft-card:active { transform: scale(0.97); }
.nft-card:hover, .nft-card:focus-visible { box-shadow: 0 10px 30px color-mix(in srgb, var(--art-a, #ff1f45) 35%, transparent), 0 0 0 1px color-mix(in srgb, var(--art-a, #ff1f45) 40%, transparent); transform: translateY(-3px); }
.nft-card__body { padding: 10px 11px 12px; }
.nft-card__name { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nft-card__num { color: var(--text-2); font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.nft-card__num .dot { width: 8px; height: 8px; }
.nft-card__row { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; gap: 6px; }
.nft-card__buy {
  padding: 6px 10px; border-radius: 9px; font-size: 12px; font-weight: 800; flex: none;
  background: linear-gradient(135deg, #ff4466, var(--red-2)); box-shadow: 0 0 12px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.3);
}
.nft-card .price { font-size: 15px; }
.nft-card--hot .nft-card__buy { display: none; }
.nft-card__meta { font-size: 11px; color: var(--text-3); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-mark { font-style: normal; }

.hot-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 8px; scroll-padding-inline: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hot-row::-webkit-scrollbar { display: none; }
.nft-card--hot { flex: none; width: 156px; scroll-snap-align: start; box-shadow: 0 8px 24px color-mix(in srgb, var(--art-a, #ff1f45) 28%, transparent); }
.nft-card--hot .nft-art__icon { font-size: 58px; }

/* Арт NFT: градієнт фону + емодзі (поки нема справжніх картинок) */
.nft-art {
  position: relative; aspect-ratio: 1 / 1; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, var(--art-a, #ff1f45) 0%, var(--art-b, #4a0010) 62%, #0a0507 100%);
}
.nft-art::before {
  content: ""; position: absolute; inset: 0; opacity: 0.18;
  background-image: radial-gradient(circle, rgba(255,255,255,0.9) 1.2px, transparent 1.6px);
  background-size: 22px 22px; mask-image: radial-gradient(circle at 50% 45%, transparent 30%, #000 75%);
}
.nft-art__icon { position: relative; width: 64%; height: 64%; display: grid; place-items: center; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(255,40,80,0.25)); transition: transform .3s var(--ease); }
.nft-art__icon svg { width: 100%; height: 100%; }
.nft-card:hover .nft-art__icon { transform: scale(1.08) rotate(-4deg); }
.nft-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.nft-art__badge {
  position: absolute; top: 8px; left: 8px; padding: 3px 7px; border-radius: 7px; font-size: 10px; font-weight: 800;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12); letter-spacing: 0.3px;
}
.rare-tag {
  position: absolute; left: 8px; bottom: 8px; padding: 3px 7px; border-radius: 7px; font-size: 10px; font-weight: 900;
  background: linear-gradient(135deg, #ffd36b, #ff9f1c); color: #2b1600; box-shadow: 0 0 12px rgba(255,190,60,0.55);
  animation: rarePulse 2.4s ease-in-out infinite;
}
@keyframes rarePulse { 50% { box-shadow: 0 0 20px rgba(255,190,60,0.9); } }
.nft-art--lg { border-radius: var(--r-lg); width: min(100%, 290px); margin: 0 auto; }
.nft-art--lg .nft-art__icon { font-size: 116px; animation: bob 3.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(3deg); } }
.nft-art--sm { width: 52px; height: 52px; aspect-ratio: auto; border-radius: 12px; flex: none; }
.nft-art--sm .nft-art__icon { font-size: 26px; }
.nft-art--sm::before { display: none; }
.art-stage { position: relative; padding-top: 4px; }
.art-stage--compact .nft-art--lg { width: min(62%, 220px); }
.art-stage--compact .nft-art--lg .nft-art__icon { font-size: 88px; }
.art-stage .nft-art--lg { box-shadow: 0 18px 50px color-mix(in srgb, var(--art-a, #ff1f45) 45%, transparent); }
.art-stage::before { /* червона «орбіта» за артом */
  content: ""; position: absolute; left: 50%; top: 52%; width: 120%; height: 34%; border-radius: 50%;
  border: 2px solid rgba(255, 40, 70, 0.55); transform: translate(-50%, -50%) rotate(-14deg);
  filter: drop-shadow(0 0 10px var(--red-glow)); pointer-events: none;
}

/* Обране */
.fav {
  position: absolute; top: 6px; right: 6px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12); color: #fff;
}
.fav svg { width: 17px; height: 17px; }
.fav.is-on { color: var(--red); background: rgba(255,255,255,0.92); border-color: transparent; }
.fav.is-on svg { fill: currentColor; }
.fav.pop { animation: pop 0.4s var(--ease); }
@keyframes pop { 40% { transform: scale(1.35); } }
.fav--lg { position: static; width: 44px; height: 44px; flex: none; background: var(--bg-2); border-color: var(--line-strong); }
.fav--lg svg { width: 22px; height: 22px; }

/* ---------- Ціна ---------- */
.price { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 700; font-size: 14px; white-space: nowrap; }
.price--lg { font-size: 24px; }
.cur-icon { width: 16px; height: 16px; flex: none; }

/* ---------- Кнопки ---------- */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 800; font-size: 15px; width: 100%;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn--primary { background: linear-gradient(135deg, #ff4466 0%, var(--red) 35%, var(--red-2) 75%, #b5001f 100%); box-shadow: 0 8px 28px rgba(255, 20, 55, 0.45), inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.15); }
.btn--glow::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
  background-size: 250% 100%; animation: shine 3.2s ease-in-out infinite;
}
.btn--ghost { background: var(--bg-2); border: 1px solid var(--line-strong); }
.btn--danger { background: transparent; border: 1px solid rgba(255,80,80,0.4); color: #ff6b6b; }
.btn--sm { height: 38px; font-size: 13px; border-radius: 11px; padding: 0 14px; width: auto; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* ---------- Картки / списки ---------- */
.card { border-radius: var(--r); padding: 14px; background: linear-gradient(165deg, var(--card-2), var(--card)); border: 1px solid var(--line); }
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.list-item__main { flex: 1; min-width: 0; }
.list-item__title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.list-item__sub { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item__end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.deal-card { animation: cardIn 0.4s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 50ms); transition: border-color .2s; }
.deal-card:hover { border-color: var(--line-strong); }
.lock-ic svg { width: 14px; height: 14px; color: var(--red); }

.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.07); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--text-2); }
.kv--total { font-weight: 800; font-size: 15px; }
.kv--total span:first-child { color: var(--text); }

.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.attr { position: relative; padding: 10px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }
.attr__k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 800; }
.attr__v { font-weight: 800; font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attr__r { font-size: 11px; color: var(--red); font-weight: 800; }
.attr__sw { position: absolute; top: 10px; right: 10px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }

details.how summary { list-style: none; cursor: pointer; gap: 8px; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary svg { color: var(--red); width: 20px; height: 20px; }
details.how summary::after { content: "+"; margin-left: auto; color: var(--red); font-weight: 900; }
details.how[open] summary::after { content: "−"; }
.how__list { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }

/* ---------- Статуси ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 800;
  white-space: nowrap; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 12%, transparent);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--red { color: var(--red); } .badge--warn { color: var(--warn); } .badge--info { color: var(--info); }
.badge--ok { color: var(--ok); } .badge--muted { color: var(--text-3); }
.badge--red::before, .badge--warn::before, .badge--info::before { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.badge--lock { color: #fff; border-color: var(--line-strong); background: rgba(255,31,69,0.12); }
.badge--lock::before { display: none; }
.badge--lock svg { width: 12px; height: 12px; color: var(--red); }

/* ---------- Таймлайн угоди ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.tl { position: relative; display: flex; gap: 12px; padding-bottom: 18px; animation: fadeUp .35s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: rgba(255,255,255,0.08); }
.tl:last-child::before { display: none; }
.tl__dot {
  width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--bg-2); border: 2px solid rgba(255,255,255,0.12); color: var(--text-3); font-size: 12px; font-weight: 800;
}
.tl__dot svg { width: 14px; height: 14px; stroke-width: 3; }
.tl__title { font-weight: 800; font-size: 14px; color: var(--text-3); padding-top: 4px; }
.tl__sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.tl.is-done .tl__dot { background: var(--red); border-color: var(--red); color: #fff; }
.tl.is-done::before { background: linear-gradient(var(--red), rgba(255,31,69,0.3)); }
.tl.is-done .tl__title { color: var(--text); }
.tl.is-active .tl__dot { border-color: var(--red); color: var(--red); box-shadow: 0 0 0 4px rgba(255,31,69,0.15), 0 0 16px var(--red-glow); animation: pulse 1.6s ease-in-out infinite; }
.tl.is-active .tl__title { color: var(--text); }
.tl.is-active .tl__sub { color: var(--text-2); }
.tl.is-fail .tl__dot { border-color: var(--text-3); background: #222; color: var(--text-2); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,31,69,0.06), 0 0 22px var(--red-glow); } }

.timer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; margin-bottom: 12px;
  background: rgba(255, 31, 69, 0.08); border: 1px solid var(--line-strong);
}
.timer__val { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--red); text-shadow: 0 0 14px var(--red-glow); font-variant-numeric: tabular-nums; }

.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; font-size: 13px; color: var(--text-2); background: rgba(255, 181, 71, 0.06); border: 1px solid rgba(255, 181, 71, 0.25); }
.note > span { color: var(--warn); flex: none; display: flex; }
.note svg { color: inherit; width: 18px; height: 18px; margin-top: 1px; }
.note b { color: var(--text); }
.note--info { background: rgba(102,168,255,.06); border-color: rgba(102,168,255,.3); }
.note--info > span { color: var(--info); }
.note--ok { background: rgba(47,227,154,.07); border-color: rgba(47,227,154,.35); }
.note--ok > span { color: var(--ok); }

.linkbox__url { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: #000; border: 1px dashed var(--line-strong); word-break: break-all; user-select: all; }
.linkbox .field__label { display: flex; align-items: center; gap: 6px; }
.linkbox .field__label svg { width: 15px; height: 15px; color: var(--red); }

/* ---------- Форми ---------- */
.field { margin-top: 16px; }
.field__label { font-size: 12px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.8px; margin: 0 2px 8px; display: block; }
.step-label { margin-top: 22px; }
.input {
  width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; outline: 0;
  background: var(--bg-2); border: 1px solid var(--line); font-size: 16px; font-weight: 700; transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,31,69,0.14); }
.input::placeholder { color: var(--text-3); font-weight: 500; }
.input-wrap { position: relative; flex: 1; }
.input--price { padding-right: 90px; font-family: var(--font-display); font-size: 20px; }
.input-wrap__suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--text-2); pointer-events: none; }
.input-wrap--at .input { padding-left: 36px; }
.input-wrap__prefix { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-weight: 900; color: var(--red); font-size: 17px; pointer-events: none; }
.range { display: flex; align-items: center; gap: 8px; }
.range__dash { color: var(--text-3); }

.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick-grid--empty { display: block; }
.pick { border-radius: 14px; overflow: hidden; border: 2px solid transparent; background: var(--card); position: relative; text-align: left; animation: cardIn .4s var(--ease) backwards; animation-delay: calc(var(--i,0) * 50ms); transition: border-color .2s, box-shadow .2s, transform .15s; }
.pick:active { transform: scale(0.96); }
.pick.is-active { border-color: var(--red); box-shadow: 0 0 18px var(--red-glow); }
.pick .nft-art__icon { font-size: 38px; }
.pick__name { font-size: 11px; font-weight: 800; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick__lock { position: absolute; inset: 0; background: rgba(0,0,0,0.62); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--text-2); text-align: center; padding: 6px; }
.pick__check { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); display: grid; place-items: center; transform: scale(0); transition: transform .25s var(--ease); box-shadow: 0 0 10px var(--red-glow); }
.pick__check svg { width: 13px; height: 13px; stroke-width: 3; }
.pick.is-active .pick__check { transform: scale(1); }

/* ---------- Опції в шторках (мова, сортування, моделі) ---------- */
.opt-list { max-height: 46vh; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 12px; margin-bottom: 6px;
  background: var(--bg-2); border: 1px solid var(--line); text-align: left; font-weight: 700; transition: all .18s;
}
.option.is-active { border-color: var(--red); background: rgba(255,31,69,0.12); }
.option__label { flex: 1; }
.option__count { font-size: 12px; color: var(--text-3); font-weight: 800; }
.option__tag { min-width: 34px; height: 26px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.06); font-size: 12px; font-weight: 900; }
.option__check, .option__box { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.option__check svg, .option__box svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; transition: opacity .15s; }
.option__box { border: 2px solid rgba(255,255,255,0.18); }
.option.is-active .option__box { background: var(--red); border-color: var(--red); }
.option.is-active .option__check { color: var(--red); }
.option.is-active svg { opacity: 1; }

.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); transition: all .18s; }
.swatch__color { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18); transition: transform .2s var(--ease); }
.swatch__color svg { width: 22px; height: 22px; stroke-width: 3; opacity: 0; transform: scale(0.5); transition: all .2s var(--ease); }
.swatch__name { font-size: 12px; font-weight: 800; text-align: center; }
.swatch__count { font-size: 11px; color: var(--text-3); font-weight: 700; }
.swatch.is-active { border-color: var(--red); background: rgba(255,31,69,0.1); box-shadow: 0 0 14px rgba(255,31,69,0.25); }
.swatch.is-active .swatch__color { transform: scale(1.06); box-shadow: inset 0 0 0 2px #fff, 0 0 16px rgba(255,255,255,0.25); }
.swatch.is-active svg { opacity: 1; transform: none; }

/* ---------- Профіль ---------- */
.profile-card { position: relative; overflow: hidden; }
.profile-card::before { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,31,69,0.35), transparent); pointer-events: none; }
.profile-head { display: flex; align-items: center; gap: 14px; position: relative; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; position: relative; }
.stat { text-align: center; padding: 12px 6px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
.stat__v { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.stat__k { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lang-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); transition: all .2s; }
.lang-btn b { font-family: var(--font-display); font-size: 16px; }
.lang-btn span { font-size: 12px; color: var(--text-2); font-weight: 700; }
.lang-btn.is-active { border-color: var(--red); background: rgba(255,31,69,0.14); box-shadow: 0 0 16px rgba(255,31,69,0.3); }
.lang-btn.is-active b { color: var(--red); }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 13px 2px; width: 100%; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; }
.menu-item:last-child { border-bottom: 0; }
.menu-item svg { color: var(--red); width: 20px; height: 20px; }
.menu-item .chev { margin-left: auto; color: var(--text-3); }
details.rule { border-bottom: 1px solid rgba(255,255,255,0.05); }
details.rule:last-child { border-bottom: 0; }
details.rule summary { list-style: none; cursor: pointer; padding: 12px 2px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
details.rule summary::-webkit-details-marker { display: none; }
details.rule summary::after { content: "+"; color: var(--red); font-weight: 900; }
details.rule[open] summary::after { content: "−"; }
details.rule p { margin: 0 2px 12px; color: var(--text-2); font-size: 13px; }

/* ---------- Порожній стан / скелетони ---------- */
.empty { text-align: center; padding: 34px 20px; color: var(--text-2); }
.empty__icon { font-size: 44px; margin-bottom: 8px; animation: bob 3s ease-in-out infinite; }
.skeleton { border-radius: var(--r); background: linear-gradient(100deg, #120c0f 30%, #1e1216 50%, #120c0f 70%); background-size: 300% 100%; animation: shimmer 1.3s linear infinite; aspect-ratio: 0.78; }
@keyframes shimmer { to { background-position: -150% 0; } }

/* ---------- Нижня навігація ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; align-items: flex-end;
  max-width: 560px; margin: 0 auto; padding: 8px 4px calc(8px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(8,6,8,0.78), rgba(5,5,6,0.98));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
}
.tabbar::before { content: ""; position: absolute; left: 8%; right: 8%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--red), #fff, var(--red), transparent); opacity: 0.7; }
.tab { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--text-3); font-size: 10.5px; font-weight: 700; transition: color .2s; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab svg { transition: transform .25s var(--ease); }
.tab.is-active { color: var(--text); }
.tab.is-active svg { color: var(--red); filter: drop-shadow(0 0 6px var(--red-glow)); transform: translateY(-2px); }
.tab:not(.tab--sell).is-active::before {
  content: ""; position: absolute; top: -9px; left: 50%; width: 22px; height: 3px; border-radius: 0 0 3px 3px; transform: translateX(-50%);
  background: var(--red); box-shadow: 0 0 12px var(--red);
}
.tab__badge { position: absolute; top: 1px; left: calc(50% + 5px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-style: normal; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 10px var(--red-glow); animation: pop .4s var(--ease); }
.tab__fab {
  position: relative; width: 54px; height: 54px; margin-top: -30px; border-radius: 17px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--red), var(--red-2)); box-shadow: 0 0 0 4px var(--bg), 0 0 24px var(--red-glow);
  transform: rotate(45deg); transition: transform .3s var(--ease);
}
.tab__fab::after { /* пульсуюче кільце */
  content: ""; position: absolute; inset: -4px; border-radius: 20px; border: 2px solid var(--red); opacity: 0;
  animation: ring 2.4s ease-out infinite;
}
@keyframes ring { 0% { opacity: 0.7; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.45); } }
.tab__fab svg { transform: rotate(-45deg); width: 26px; height: 26px; stroke-width: 2.6; }
.tab--sell:active .tab__fab { transform: rotate(45deg) scale(0.92); }
.tab--sell.is-active .tab__fab { box-shadow: 0 0 0 4px var(--bg), 0 0 34px var(--red); transform: rotate(135deg); }
.tab--sell.is-active .tab__fab svg { transform: rotate(-135deg); }
.tab--sell.is-active svg { color: #fff; filter: none; }

/* ---------- Шторка ---------- */
.sheet-layer { position: fixed; inset: 0; z-index: 40; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(3px); animation: fade 0.2s ease both; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + var(--safe-bottom));
  background: linear-gradient(180deg, #160b0f, var(--bg) 40%); border: 1px solid var(--line-strong); border-bottom: 0;
  box-shadow: 0 -10px 50px rgba(255, 20, 55, 0.22); animation: slideUp 0.32s var(--ease) both;
}
.sheet__handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 14px; }
.sheet__close { position: absolute; z-index: 3; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.08); }
.sheet__close svg { width: 18px; height: 18px; }
.sheet__footer {
  position: sticky; bottom: calc(-20px - var(--safe-bottom)); z-index: 2; display: flex; gap: 10px;
  margin: 16px -16px calc(-20px - var(--safe-bottom)); padding: 12px 16px calc(14px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(5,5,6,0), var(--bg) 30%);
}
.sheet__footer .btn--ghost { flex: 0 0 38%; }
.sheet__footer .btn:only-child { flex: 1 1 auto; }
.sheet__footer:empty { display: none; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- Тости ---------- */
.toast-wrap { position: fixed; left: 0; right: 0; top: calc(var(--safe-top) + 12px); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast {
  max-width: 420px; width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 14px; font-weight: 700;
  background: rgba(20, 10, 14, 0.96); border: 1px solid var(--line-strong); box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,31,69,0.2);
  animation: toastIn 0.35s var(--ease) both; transition: opacity .3s, transform .3s;
}
.toast--ok { border-color: rgba(47, 227, 154, 0.5); }
.toast--err { border-color: rgba(255, 90, 90, 0.7); }
.toast--out { opacity: 0; transform: translateY(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(0.96); } }

/* ---------- Конфеті ---------- */
.confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: confFall linear forwards; }
@keyframes confFall { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: 0.8; } }

.demo-flag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 3px 7px; border-radius: 6px; background: rgba(255,181,71,0.12); color: var(--warn); border: 1px solid rgba(255,181,71,0.3); }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }


/* =========================================================
   v0.3 — аукціони, торг, нові фільтри
   ========================================================= */
.segment--4 .segment__btn { font-size: 12.5px; padding: 9px 2px; gap: 4px; }
.seg-badge { min-width: 17px; height: 17px; font-size: 10.5px; }
.seg-count { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 900; display: inline-grid; place-items: center; background: rgba(255,255,255,0.12); }
.seg-count:empty { display: none; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: blink 1.2s ease-in-out infinite; font-style: normal; }
.segment__btn.is-active .live-dot { background: #fff; box-shadow: 0 0 8px #fff; }

/* LIVE і таймер на картці аукціону */
.live-badge {
  position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 7px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px; color: #fff; background: linear-gradient(135deg, #ff3355, #d4002a);
  box-shadow: 0 0 14px rgba(255,31,69,0.7);
}
.live-badge i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1s ease-in-out infinite; }
.live-badge--lg { left: 12px; bottom: 12px; font-size: 12px; padding: 5px 10px; }
.live-badge.is-off { background: #333; box-shadow: none; }
.live-badge.is-off i { animation: none; opacity: .5; }
.ends-chip {
  position: absolute; right: 8px; bottom: 8px; padding: 3px 8px; border-radius: 7px; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15);
}
.ends-chip.is-urgent, .auc-timer.is-urgent, .ends-inline.is-urgent { color: #ff5470; border-color: rgba(255,84,112,0.6); animation: blink 1s ease-in-out infinite; }
.nft-card--auction .nft-card__buy { background: linear-gradient(135deg, #ffb547, #ff6a00); color: #1a0a00; box-shadow: 0 0 12px rgba(255,150,40,0.55); }
.offer-tag {
  position: absolute; right: 8px; bottom: 8px; padding: 3px 7px; border-radius: 7px; font-size: 10px; font-weight: 900;
  background: rgba(255,255,255,0.92); color: #1a0508;
}
.nft-art .rare-tag + .offer-tag { bottom: 8px; }

/* Шторка аукціону */
.auc-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.auc-panel__cell {
  display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; min-width: 0;
  background: linear-gradient(165deg, var(--card-2), var(--card)); border: 1px solid var(--line);
}
.auc-panel__cell > .auc-label { font-size: 11px; color: var(--text-2); font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
.auc-panel__cell em { font-style: normal; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.auc-panel__cell--timer { border-color: var(--line-strong); background: linear-gradient(165deg, rgba(255,31,69,0.14), var(--card)); }
.auc-timer { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--red); text-shadow: 0 0 14px var(--red-glow); font-variant-numeric: tabular-nums; line-height: 1.1; }
.price--lg { font-size: 22px; }
.bump { animation: bump .6s var(--ease); }
@keyframes bump { 30% { transform: scale(1.18); color: var(--ok); } }
.lead-banner {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; font-weight: 800;
  background: linear-gradient(135deg, rgba(47,227,154,0.18), rgba(47,227,154,0.05)); border: 1px solid rgba(47,227,154,0.45); color: var(--ok);
}
.lead-banner svg { width: 18px; height: 18px; }
.bid-box { border-color: var(--line-strong); }
.quick-row { display: flex; gap: 6px; flex-wrap: wrap; }
.quick {
  padding: 7px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; color: var(--text-2);
  background: var(--bg-2); border: 1px solid var(--line); transition: all .15s;
}
.quick:active { transform: scale(0.95); }
.quick:hover { color: #fff; border-color: var(--red); }
.bid-list { padding: 6px 12px; }
.bid-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.07); font-size: 13.5px; animation: fadeUp .35s var(--ease) backwards; }
.bid-row:last-child { border-bottom: 0; }
.bid-row__ava { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--bg-2); border: 1px solid var(--line); font-weight: 800; font-size: 12px; }
.bid-row__ava svg { width: 15px; height: 15px; }
.bid-row__user { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bid-row__user i { font-style: normal; font-size: 10px; font-weight: 900; color: #1a0a00; background: #ffc24a; padding: 1px 6px; border-radius: 5px; margin-left: 4px; text-transform: uppercase; }
.bid-row__time { font-size: 11px; color: var(--text-3); }
.bid-row.is-top .bid-row__ava { background: linear-gradient(135deg, #ffd36b, #ff9f1c); color: #2b1600; border: 0; box-shadow: 0 0 12px rgba(255,190,60,0.6); }
.bid-row.is-me .bid-row__user { color: var(--red); }

/* Торг */

  const escP = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function t(key, params) {
    let s = (D[lang] && D[lang][key]) ?? D.ru[key] ?? key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? escP(params[k]) : m));
    return s;
  }

  window.I18N = {
    LANGS,
    t,
    get lang() { return lang; },
    get locale() { return LANGS[lang].locale; },
    setLang(l) {
      if (!D[l]) return;
      lang = l;
      try { localStorage.setItem("tg_lang", l); } catch (e) {}
      document.documentElement.lang = l;
      // статичні написи в index.html з атрибутом data-i18n
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    },
  };
  window.t = t;

  <script>/* ===== js/emoji.js ===== */
/* =========================================================
   TrionGift Premium Emoji — анімовані емоджі в стилі лого:
   чорне глянцеве тіло + неоновий червоний контур + біле/червоне.
   Полотно 100×100 (як у custom emoji Telegram), цикл 2 с.

   TE.svg(id, cls)  — SVG-рядок емоджі (анімації з css/emoji.css)
   TE.list          — [{id, emoji, uk, ru, en, cat}]
   ========================================================= */
(function () {
  const O = "#1c0207";                       // темний контур
  const RED = "#ff1f3d", PINK = "#ff8fa3", WHITE = "#fff";
  const DEFS = `
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="teK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0a15"/><stop offset=".45" stop-color="#120306"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="teRim" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="92"><stop offset="0" stop-color="#ff6b7d"/><stop offset=".5" stop-color="#ff1f3d"/><stop offset="1" stop-color="#c4001d"/></linearGradient>
    <linearGradient id="teR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6176"/><stop offset=".5" stop-color="#ff1f3d"/><stop offset="1" stop-color="#a00019"/></linearGradient>
    <linearGradient id="teW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffc9d3"/></linearGradient>
    <radialGradient id="teGloss" cx=".32" cy=".26" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs></svg>`;

  /* ---------- пензлі ---------- */
  const at = (a) => (a ? " " + a : "");
  const RIM = (w = 5) => `stroke="url(#teRim)" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  // чорне тіло з червоним неоновим контуром
  const K = (d, a) => `<path d="${d}" fill="url(#teK)" ${RIM()}${at(a)}/>`;
  const KC = (x, y, r, a) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#teK)" ${RIM()}${at(a)}/>`;
  // червоне тіло з темним контуром
  const R = (d, a) => `<path d="${d}" fill="url(#teR)" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"${at(a)}/>`;
  const RC = (x, y, r, a) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#teR)" stroke="${O}" stroke-width="3.5"${at(a)}/>`;
  // біле тіло з темним контуром
  const W = (d, a) => `<path d="${d}" fill="url(#teW)" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"${at(a)}/>`;
  const WC = (x, y, r, a) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#teW)" stroke="${O}" stroke-width="3"${at(a)}/>`;
  // суцільні (для обертових частин — щоб градієнт не «стрибав» на стику циклу)
  const KS = (d, a) => `<path d="${d}" fill="#120306" stroke="#ff2a45" stroke-width="5" stroke-linejoin="round"${at(a)}/>`;
  const RS = (d, a) => `<path d="${d}" fill="${RED}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"${at(a)}/>`;
  // лінії
  const L = (d, c = "url(#teRim)", w = 5, a) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${at(a)}/>`;

  <script>/* ===== js/telegram.js ===== */
/* =========================================================
   Обгортка над Telegram WebApp SDK.
   Поза Telegram (у звичайному браузері) повертає демо-користувача,
   щоб інтерфейс можна було розробляти й тестувати без бота.
   ========================================================= */
(function () {
  const wa = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(wa && wa.initData);

  function safe(fn) { try { return fn(); } catch (e) { /* старі версії Telegram не мають деяких методів */ } }

  const TG = {
    inTelegram,
    sdk: wa || null,

    init() {
      if (!wa) return;
      safe(() => wa.ready());
      safe(() => wa.expand());
      safe(() => wa.setHeaderColor("#050506"));
      safe(() => wa.setBackgroundColor("#050506"));
      safe(() => wa.setBottomBarColor && wa.setBottomBarColor("#050506"));
      safe(() => wa.disableVerticalSwipes && wa.disableVerticalSwipes());
      safe(() => wa.enableClosingConfirmation && wa.enableClosingConfirmation());
    },

    // Поточний користувач. ВАЖЛИВО: initDataUnsafe лише для показу в інтерфейсі.
    // Справжню особу бекенд визначає, перевіряючи підпис initData.
    get user() {
      const u = wa && wa.initDataUnsafe && wa.initDataUnsafe.user;
      if (u) return u;
      return { id: 100000001, first_name: "Demo", username: "demo_user", photo_url: null, is_demo: true };
    },

    // Рядок initData — відправляється на бекенд у кожному запиті
    get initData() { return (wa && wa.initData) || ""; },

    // Параметр з посилання t.me/bot/app?startapp=deal_D-1234 (відкрити угоду одразу)
    get startParam() { return (wa && wa.initDataUnsafe && wa.initDataUnsafe.start_param) || null; },

    haptic(type = "light") {
      if (!wa || !wa.HapticFeedback) return;
      safe(() => {
        if (type === "success" || type === "error" || type === "warning") wa.HapticFeedback.notificationOccurred(type);
        else if (type === "select") wa.HapticFeedback.selectionChanged();
        else wa.HapticFeedback.impactOccurred(type);
      });
    },

    // Системна кнопка «Назад» у шапці Telegram
    _backHandler: null,
    showBack(handler) {
      if (!wa || !wa.BackButton) return;
      safe(() => {
        if (TG._backHandler) wa.BackButton.offClick(TG._backHandler);
        TG._backHandler = handler;
        wa.BackButton.onClick(handler);
        wa.BackButton.show();
      });
    },
    hideBack() {
      if (!wa || !wa.BackButton) return;
      safe(() => {
        if (TG._backHandler) wa.BackButton.offClick(TG._backHandler);
        TG._backHandler = null;
        wa.BackButton.hide();
      });
    },

    // Відкрити посилання Telegram (наприклад, рахунок Crypto Pay: t.me/send?start=IV...)
    openTelegramLink(url) {
      if (wa && wa.openTelegramLink) return safe(() => wa.openTelegramLink(url));
      window.open(url, "_blank");
    },
    openLink(url) {
      if (wa && wa.openLink) return safe(() => wa.openLink(url));
      window.open(url, "_blank");
    },
  };

  window.TG = TG;
})();

</script>

(function () {

  const BACKDROPS = [

    ["Grape", "#8a3fd0", "#2c0e4a"], ["Mystic Pearl", "#e0c8d8", "#6b5566"], ["Fandango", "#c0408f", "#4a0f35"],
    ["Mexican Pink", "#ff3ba5", "#5a0a3a"], ["Raspberry", "#e5307a", "#55102e"], ["Strawberry", "#ff4d6a", "#5a0f1d"],
    ["Coral Red", "#ff5a4f", "#5a1410"], ["Burgundy", "#b0123c", "#300010"], ["Rosewood", "#9b3a4a", "#3a0f18"],
    ["Persimmon", "#ff6d3b", "#5a2008"], ["Carrot Juice", "#ff8a2b", "#5a2c06"], ["Orange", "#ff9f1c", "#5a3200"],
    ["Amber", "#ffb41f", "#5a3d00"], ["Pure Gold", "#ffd23f", "#5a4600"], ["Satin Gold", "#d9b44a", "#4a3b10"],
    ["Old Gold", "#c8a84b", "#43360f"], ["Caramel", "#d99a4e", "#4a2f12"], ["Copper", "#c87533", "#45230c"],
    ["Chestnut", "#a45a3a", "#3a1a0e"], ["Cappuccino", "#b08a6a", "#3e2c1e"], ["Desert Sand", "#d8bc8a", "#5a4a2e"],
    ["Khaki Green", "#a8a060", "#3e3a1c"], ["Light Olive", "#b5c45a", "#3e4a12"], ["Lemongrass", "#c8e04b", "#40500e"],
    ["Pistachio", "#9ad06a", "#2e4a1a"], ["Mint Green", "#5fe0a0", "#0e4a2e"], ["Malachite", "#2fd08a", "#064a2c"],
    ["Emerald", "#22c76f", "#063d22"], ["Shamrock Green", "#3fbf5a", "#0e3d18"], ["Sea Green", "#2fb08a", "#0a3a2c"],
    ["Pine Green", "#2f8a5a", "#0a2a1a"], ["Hunter Green", "#3a7a4a", "#0e2414"], ["Camo Green", "#6a7a4a", "#1e2414"],
    ["Tactical Pine", "#3a5a4a", "#101c16"], ["Aquamarine", "#4fe0d0", "#0a4a46"], ["Pacific Cyan", "#2fc0e0", "#08404e"],
    ["Deep Cyan", "#1aa0b0", "#063a40"], ["Moonstone", "#7ab0c0", "#25404a"],
  ].map(([name, a, b]) => ({ name, colors: [a, b] }));

  const MODELS = ["Inferno", "Ruby", "Obsidian", "Neon", "Ghost", "Crimson", "Onyx", "Ember", "Phantom", "Blood Moon", "Frost", "Nebula", "Amethyst", "Toxic"];
  const SYMBOLS = ["Star", "Flame", "Crown", "Gem", "Skull", "Torch", "Bolt", "Heart"];
  const USERS = [
    { id: 2001, username: "nft_hunter", name: "Олег", deals: 128, rating: 4.9 },
    { id: 2002, username: "giftlord", name: "Марія", deals: 54, rating: 5.0 },
    { id: 2003, username: "redtrader", name: "Артем", deals: 17, rating: 4.7 },
    { id: 2004, username: "pepe_whale", name: "Ігор", deals: 302, rating: 4.95 },
    { id: 2005, username: "collector_ua", name: "Настя", deals: 9, rating: 4.8 },
    { id: 2006, username: "ton_shark", name: "Влад", deals: 77, rating: 4.85 },
  ];

  let seed = 13;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const round = (n) => Math.round(n * 100) / 100;

  // У продажі лише частина колекцій — решта показується у фільтрі з нулем
  const onSale = COLLECTIONS.filter((_, i) => i % 2 === 0 || i < 6);

  function makeGift(col) {
    col = col || pick(onSale);
    const ci = COLLECTIONS.indexOf(col);
    const models = MODELS.slice((ci * 3) % 10, (ci * 3) % 10 + 4);
    const bd = BACKDROPS[Math.floor(rnd() * 26) * 2 % BACKDROPS.length]; // ~половина фонів
    const number = 100 + Math.floor(rnd() * 98000);
    return {
      slug: col.name.replace(/[^A-Za-z0-9]/g, "") + "-" + number, // як у t.me/nft/CrystalBall-1842
      collectionId: col.id, collection: col.name, number,
      colors: bd.colors, imageUrl: null,
      attrs: {
        model:    { name: pick(models), rarity: round(0.3 + rnd() * 2.7) },
        backdrop: { name: bd.name, rarity: round(0.5 + rnd() * 2.5), colors: bd.colors },
        symbol:   { name: pick(SYMBOLS), rarity: round(0.2 + rnd() * 1.8) },
      },
    };
  }

  const now = Date.now();
  const MIN = 60000, H = 3600000;
  const listings = [];

  // Фіксована ціна (частина — з торгом)
  for (let i = 0; i < 34; i++) {
    const currency = rnd() > 0.35 ? "GRAM" : "USDT";
    const price = round(currency === "GRAM" ? 3 + rnd() * 140 : 8 + rnd() * 420);
    const allowOffers = rnd() > 0.45;
    const r = rnd();
    listings.push({
      id: "L" + (1001 + i), type: "fixed", gift: makeGift(), price, currency, seller: pick(USERS),
      feePayer: r < 0.6 ? "buyer" : r < 0.85 ? "seller" : "split",
      allowOffers, minOffer: allowOffers && rnd() > 0.5 ? round(price * 0.7) : null,
      createdAt: now - Math.floor(rnd() * 5 * 86400000),
    });
  }

  // Аукціони
  const ENDS = [95 * 1000, 6 * MIN, 42 * MIN, 3 * H, 9 * H, 20 * H, 30 * H, 52 * H, 70 * H, 4 * MIN, 15 * H, 2 * H];
  ENDS.forEach((ms, i) => {
    const currency = rnd() > 0.3 ? "GRAM" : "USDT";
    const start = round(currency === "GRAM" ? 2 + rnd() * 60 : 5 + rnd() * 150);
    const seller = pick(USERS);
    const bids = [];
    let cur = start;
    const n = i === 0 ? 2 : Math.floor(rnd() * 7);
    for (let k = 0; k < n; k++) {
      const u = pick(USERS.filter((x) => x.id !== seller.id));
      bids.push({ userId: u.id, username: u.username, amount: cur, at: now - (n - k) * 7 * MIN });
      cur = round(cur * (1.05 + rnd() * 0.2));
    }
    listings.push({
      id: "A" + (501 + i), type: "auction", gift: makeGift(), currency, seller, feePayer: i % 3 === 0 ? "seller" : "buyer",
      startPrice: start, price: bids.length ? bids[bids.length - 1].amount : start,
      bids, endsAt: now + ms, status: "active", createdAt: now - 3 * H,
    });
  });

  const recentSales = Array.from({ length: 10 }, (_, i) => {
    const currency = rnd() > 0.4 ? "GRAM" : "USDT";
    return { gift: makeGift(), price: round(currency === "GRAM" ? 5 + rnd() * 90 : 10 + rnd() * 300), currency, at: now - (i + 1) * 97000 };
  });

  // NFT поточного користувача (на бекенді — getUserGifts по його id)
  const C = (name) => COLLECTIONS.find((c) => c.name === name);
  const myGifts = [
    { ...makeGift(C("Top Hat")), canTransfer: true },
    { ...makeGift(C("Loot Bag")), canTransfer: true },
    { ...makeGift(C("Ion Gem")), canTransfer: false, transferAvailableAt: now + 3 * 86400000 },
    { ...makeGift(C("Crystal Ball")), canTransfer: true },
    { ...makeGift(C("Eternal Rose")), canTransfer: true },
    { ...makeGift(C("Plush Pepe")), canTransfer: true },
  ];

  // поля комісії угоди з урахуванням платника
  const fees = (p, payer = "buyer") => {
    const fee = round(p * 0.03), buyerFee = payer === "buyer" ? fee : payer === "split" ? round(fee / 2) : 0;
    return { price: p, fee, feePayer: payer, buyerFee, sellerFee: round(fee - buyerFee), total: round(p + buyerFee), payout: round(p - (fee - buyerFee)) };
  };
  const deals = [
    (() => { // користувач — продавець, має прийняти угоду
      const g = makeGift(C("Eternal Rose"));
      return {
        id: "D-7741", role: "seller", source: "market", agreed: false, private: false,
        gift: g, currency: "GRAM", ...fees(64, "buyer"),
        counterpart: { id: 3001, username: "buyer_max", name: "Макс" },
        status: "paid", createdAt: now - 3 * MIN, deadline: now + 12 * MIN,
        history: [{ status: "awaiting_payment", at: now - 5 * MIN }, { status: "paid", at: now - 3 * MIN }],
      };
    })(),
    (() => { // вхідна приватна угода — треба оплатити
      const g = makeGift(C("Heart Locket"));
      return {
        id: "D-3108", role: "buyer", source: "private", agreed: true, private: true,
        gift: g, currency: "USDT", ...fees(120, "split"),
        counterpart: { id: 2002, username: "giftlord", name: "Марія" },
        status: "awaiting_payment", createdAt: now - 8 * MIN, deadline: now + 52 * MIN, payUrl: "https://t.me/send?start=IVdemo",
        history: [{ status: "awaiting_payment", at: now - 8 * MIN }],
      };
    })(),
  ];

  // Торг: одна вхідна контрпропозиція для користувача-покупця (демо)
  const offerLot = listings.find((l) => l.type === "fixed" && l.allowOffers);
  const offers = [{
    id: "O-9001", role: "buyer", listingId: offerLot.id, gift: offerLot.gift, listPrice: offerLot.price, currency: offerLot.currency,
    amount: round(offerLot.price * 0.75), counter: round(offerLot.price * 0.88), status: "countered",
    counterpart: offerLot.seller, createdAt: now - 25 * MIN,
  }];

  // Обміни (type: "exchange"). want.collections порожній = «будь-який NFT»
  const WANTS = [[], ["plush-pepe", "durov-s-cap"], ["heart-locket"], [], ["crystal-ball", "ion-gem", "astral-shard"], ["top-hat"], [], ["loot-bag", "signet-ring"]];
  WANTS.forEach((want, i) => {
    const currency = i % 3 ? "GRAM" : "USDT";
    const value = round(currency === "GRAM" ? 15 + rnd() * 110 : 30 + rnd() * 300);
    listings.push({
      id: "X" + (701 + i), type: "exchange", visibility: "public", gift: makeGift(), seller: pick(USERS), currency,
      want: { collections: want }, value, price: value, topup: 0, topupFrom: null,
      feePayer: ["creator", "taker", "split"][i % 3], status: "open", createdAt: now - Math.floor(rnd() * 3 * 86400000),
    });
  });
  // Приватне запрошення до обміну саме для користувача
  listings.push({
    id: "X790", type: "exchange", visibility: "private", targetUsername: (window.TG && TG.user.username) || "demo_user",
    gift: makeGift(C("Swiss Watch")), seller: USERS[1], currency: "GRAM", want: { collections: ["top-hat", "loot-bag"] },
    value: 60, price: 60, topup: 0, topupFrom: null, feePayer: "split", status: "open", createdAt: now - 20 * MIN,
  });

  window.MOCK_DB = {
    COLLECTIONS, BACKDROPS, USERS, listings, recentSales, myGifts, deals, offers, swaps: [], makeGift,
    myListings: [], events: [], stats: { deals24h: 1287 },
  };
})();
