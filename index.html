  /* ----- шторка обміну (swap) ----- */
  let lastSwapKey = "";
  async function openSwap(id) {
    sheet(`<div class="skeleton" style="aspect-ratio:2"></div>`, () => { if (state.tab === "deals") loadDealsView(); });
    state.sheetCtx = { kind: "swap", id };
    state.disputeArmed = false;
    lastSwapKey = "";
    await refreshSwap();
    stopPoll();
    sheetPoll = setInterval(refreshSwap, SHEET_POLL_MS);
  }
  async function refreshSwap(force) {
    const ctx = state.sheetCtx;
    if (!ctx || ctx.kind !== "swap") return;
    let sw;
    try { sw = await API.swap(ctx.id); } catch (e) { return; }
    if (!state.sheetCtx || state.sheetCtx.id !== ctx.id || !sheetOpen()) return;
    const key = sw.status + "|" + sw.history.length + "|" + state.disputeArmed;
    if (key === lastSwapKey && force !== true) return;
    const statusChanged = lastSwapKey && sw.status !== lastSwapKey.split("|")[0];
    lastSwapKey = key;
    setSheet(swapView(sw));
    if (statusChanged) {
      $("#sheet").scrollTop = 0;
      TG.haptic(sw.status === "completed" ? "success" : "medium");
      refreshBadges();
      if (sw.status === "completed") UI.confetti();
    }
  }

  const SWAP_STEPS = ["s1", "s2", "s3", "s4", "s5"];
  const SWAP_INDEX = { awaiting_payment: 0, awaiting_safe: 1, awaiting_taker: 2, verifying: 3, completed: 5 };
  const SWAP_CLS = { awaiting_payment: "warn", awaiting_safe: "red", awaiting_taker: "info", verifying: "info", completed: "ok", cancelled: "muted", returned: "muted", dispute: "warn" };

  function swapTimeline(sw) {
    const failed = ["cancelled", "returned"].includes(sw.status);
    let at = SWAP_INDEX[sw.status];
    if (at === undefined) {
      const live = [...sw.history].reverse().find((h) => SWAP_INDEX[h.status] !== undefined);
      at = live ? SWAP_INDEX[live.status] : 0;
    }
    const items = SWAP_STEPS.map((s, i) => {
      const done = i < at, active = i === at && !failed && sw.status !== "dispute", fail = i === at && failed;
      const cls = done ? "is-done" : active ? "is-active" : fail ? "is-fail" : "";
      return `<li class="tl ${cls}" style="--i:${i}"><span class="tl__dot">${done ? ICONS.check : fail ? ICONS.x : i + 1}</span><div><div class="tl__title">${t("swap." + s + ".t")}</div><div class="tl__sub">${t("swap." + s + ".s", { safe: C.SAFE_USERNAME, stars: C.TRANSFER_STARS })}</div></div></li>`;
    });
    if (failed) items.push(`<li class="tl is-done"><span class="tl__dot">${ICONS.check}</span><div><div class="tl__title">${t("swap.x." + sw.status + ".t")}</div><div class="tl__sub">${t("swap.x." + sw.status + ".s")}</div></div></li>`);
    return `<ul class="timeline">${items.join("")}</ul>`;
  }

  function swapView(sw) {
    const me = sw.role, other = me === "creator" ? "taker" : "creator";
    const give = me === "creator" ? sw.gift : sw.takerGift, get = me === "creator" ? sw.takerGift : sw.gift;
    const myPays = me === "creator" ? sw.creatorPays : sw.takerPays, otherPays = me === "creator" ? sw.takerPays : sw.creatorPays;
    const u = sw.counterpart.username;
    const timed = sw.deadline && ["awaiting_payment", "awaiting_safe", "awaiting_taker"].includes(sw.status);
    const timerLabel = {
      awaiting_payment: t("swap.t.pay"),
      awaiting_safe: me === "creator" ? t("swap.t.safeMe") : t("swap.t.safe"),
      awaiting_taker: me === "taker" ? t("swap.t.sendMe") : t("swap.t.send"),
    }[sw.status];
    const getTopup = sw.topupFrom && sw.topupFrom === other;
    let hint = "", actions = "";
    switch (sw.status) {
      case "awaiting_payment":
        if (!sw.paid[me]) {
          hint = note(t("swap.h.payMe", { sum: sum(myPays, sw.currency) }));
          actions = `<button class="btn btn--primary btn--glow" data-action="swap-pay" data-id="${sw.id}">${t("swap.b.pay", { sum: sum(myPays, sw.currency) })}</button>`;
        } else hint = note(t("swap.h.payWait"), "info");
        actions += `<button class="btn btn--ghost mt-8" data-action="swap" data-act="cancel" data-id="${sw.id}">${t("swap.b.cancel")}</button>`;
        break;
      case "awaiting_safe":
        if (me === "creator") {
          hint = note(t("swap.h.safeMe", { nft: nftName(sw.gift), safe: C.SAFE_USERNAME }));
          actions = `<button class="btn btn--ghost" data-action="open-user" data-username="${esc(C.SAFE_USERNAME)}">${t("swap.b.openSafe", { safe: C.SAFE_USERNAME })}</button>
                     <button class="btn btn--primary btn--glow mt-8" data-action="swap" data-act="safe_sent" data-id="${sw.id}">${t("swap.b.safeSent")}</button>`;
        } else hint = note(t("swap.h.safeWait"), "info");
        break;
      case "awaiting_taker":
        if (me === "taker") {
          hint = note(t("swap.h.sendMe", { nft: nftName(sw.takerGift), u }));
          actions = `<button class="btn btn--ghost" data-action="open-user" data-username="${esc(u)}">${t("btn.openUser", { u })}</button>
                     <button class="btn btn--primary btn--glow mt-8" data-action="swap" data-act="taker_sent" data-id="${sw.id}">${t("swap.b.sent")}</button>`;
        } else hint = note(t("swap.h.sendWait", { u }), "info");
        break;
      case "verifying": hint = note(t("swap.h.verifying"), "info"); break;
      case "completed": hint = note(t("swap.h.completed", { nft: nftName(get) }), "ok"); break;
      case "cancelled": hint = note(t("swap.h.cancelled")); break;
      case "returned": hint = note(t("swap.h.returned")); break;
      case "dispute": hint = note(t("hint.dispute", { u: C.SUPPORT_USERNAME })); break;
    }
    if (["awaiting_taker", "verifying"].includes(sw.status)) {
      actions += `<button class="btn btn--danger mt-8" data-action="swap-dispute" data-id="${sw.id}">${state.disputeArmed ? t("btn.disputeConfirm") : t("btn.dispute")}</button>`;
    }
    const paidMark = (ok) => ok ? `<span class="paid-mark">${ICONS.check}${t("swap.paid")}</span>` : "";
    return `
      <div class="swap-pair" style="padding-right:36px">
        <div class="swap-pair__side"><span class="swap-pair__k">${t("swap.give")}</span>${nftArt(give, "md")}<b>${esc(nftName(give))}</b></div>
        <div class="swap-pair__arrow">${UI.ei("handshake")}</div>
        <div class="swap-pair__side"><span class="swap-pair__k">${t("swap.get")}</span>${nftArt(get, "md")}<b>${esc(nftName(get))}</b></div>
      </div>
      <div class="row between mt-12">
        <div class="row" style="gap:6px;flex-wrap:wrap"><span class="badge badge--${SWAP_CLS[sw.status]}">${t("swap.st." + sw.status)}</span>
          <span class="badge badge--lock">${UI.ei("handshake")}${sw.visibility === "private" ? t("ex.private") : t("ex.public")}</span></div>
        ${C.MOCK ? '<span class="demo-flag">DEMO</span>' : ""}
      </div>
      <div class="small muted mt-8">${t("swap.title", { id: sw.id })} · ${t("swaps.with", { u })}</div>
      ${timed ? `<div class="timer mt-12"><span class="small">${timerLabel}</span><span class="timer__val" data-ends="${sw.deadline}">${countdown(sw.deadline)}</span></div>` : '<div class="mt-12"></div>'}
      <div class="card">${swapTimeline(sw)}</div>
      <div class="card mt-12">
        <div class="kv"><span>${t("ex.value")}</span>${price(sw.value, sw.currency)}</div>
        ${sw.topupFrom ? `<div class="kv"><span>${t("ex.topup")}</span><b class="${getTopup ? "ok-text" : ""}">${getTopup ? t("ex.topupToYou", { sum: sum(sw.topup, sw.currency) }) : t("ex.topupFromYou", { sum: sum(sw.topup, sw.currency) })}</b></div>` : ""}
        <div class="kv"><span>${t("ex.feeNft", { p: C.EXCHANGE_FEE_PERCENT })}</span>${price(sw.feeNft, sw.currency)}</div>
        ${sw.topupFrom ? `<div class="kv"><span>${t("ex.feeTopup", { p: C.TOPUP_FEE_PERCENT })}</span>${price(sw.feeTopup, sw.currency)}</div>` : ""}
        <div class="kv"><span>${t("ex.feeWho")}</span><b>${exPayerLabel(sw.feePayer, me)}</b></div>
        <div class="kv kv--total"><span>${t("swap.yourPart")} ${paidMark(sw.paid[me] && myPays > 0)}</span>${price(myPays, sw.currency)}</div>
        <div class="kv"><span>${t("swap.otherPart")} ${paidMark(sw.paid[other] && otherPays > 0)}</span>${price(otherPays, sw.currency)}</div>
        <div class="small muted mt-8">${UI.ei("star", "ei--inline")} ${t("ex.starsNote", { stars: C.TRANSFER_STARS })}</div>
      </div>
      ${hint ? `<div class="mt-12">${hint}</div>` : ""}
      ${actions ? `<div class="mt-16">${actions}</div>` : ""}`;
  }

  /* =============== КЛІКИ =============== */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    const a = el.dataset.action;
    const d = state.draft;

    switch (a) {
      case "tab": if (sheetOpen()) closeSheet(); TG.haptic("select"); setTab(el.dataset.tab); break;
      case "close-sheet": closeSheet(); break;
      case "lang-menu": openLangSheet(); break;
      case "set-lang": setLang(el.dataset.lang); break;
      case "soon": toast(t("soon.toast", { what: el.dataset.what }), "", "flame"); break;

      /* маркет */
      case "market-mode":
        if (state.market.mode === el.dataset.mode) break;
        state.market.mode = el.dataset.mode;
        TG.haptic("select");
        renderMarket();
        break;
      case "search-clear":
        e.preventDefault();
        state.market.q = ""; $("#market-search").value = ""; el.hidden = true;
        loadListings();
        break;
      case "filter-collection": openCollectionSheet(); break;
      case "filter-price": openPriceSheet(); break;
      case "filter-backdrop": openBackdropSheet(); break;
      case "shuffle":
        Object.assign(state.market, { seed: newSeed(), sort: "random" });
        TG.haptic("medium");
        renderFilterBar(); loadListings();
        { const b = $('[data-action="shuffle"]'); if (b) b.classList.add("spin"); }
        toast(t("shuffled"), "", "dice");
        break;
      case "reset-filters":
        Object.assign(state.market, { collections: [], backdrops: [], sort: "random", currency: "all", min: "", max: "" });
        renderFilterBar(); loadListings();
        break;
      case "reset-all":
        Object.assign(state.market, { q: "", collections: [], backdrops: [], sort: "random", currency: "all", min: "", max: "" });
        renderMarket();
        break;

      /* чернетка фільтра */
      case "draft-toggle": {
        const v = el.dataset.value;
        d.values = d.values.includes(v) ? d.values.filter((x) => x !== v) : [...d.values, v];
        el.classList.toggle("is-active");
        TG.haptic("select");
        break;
      }
      case "draft-sort": d.sort = el.dataset.value; TG.haptic("select"); renderPriceSheet(); break;
      case "draft-currency": d.currency = el.dataset.value; d.min = ""; d.max = ""; TG.haptic("select"); renderPriceSheet(); break;
      case "draft-reset":
        if (d.kind === "price") Object.assign(d, { sort: "random", currency: "all", min: "", max: "" }); else d.values = [];
        applyDraft();
        break;
      case "apply-draft": applyDraft(); break;

      /* лот, торг, аукціон */
      case "open-listing": TG.haptic("light"); openListing(el.dataset.id); break;
      case "fav": e.stopPropagation(); toggleFav(el.dataset.id); break;
      case "buy": buy(el.dataset.id, el); break;
      case "offer-quick": $("#offer-price").value = el.dataset.v; TG.haptic("select"); break;
      case "send-offer": sendOffer(el.dataset.id, el); break;
      case "offer-act": offerAct(el.dataset.id, el.dataset.act, el); break;
      case "offer-counter": API.offers().then((o) => { const x = o.incoming.find((y) => y.id === el.dataset.id); if (x) openCounterSheet(x); }); break;
      case "counter-quick": $("#counter-price").value = el.dataset.v; TG.haptic("select"); break;
      case "send-counter": sendCounter(el.dataset.id, el); break;
      case "bid-quick": $("#bid-amount").value = el.dataset.v; TG.haptic("select"); updateBidFrozen(); break;
      case "place-bid": placeBid(el.dataset.id, el); break;

      /* угода */
      case "open-deal": TG.haptic("light"); openDeal(el.dataset.id); break;
      case "deal": dealAction(el.dataset.id, el.dataset.act, el); break;
      case "deal-pay": payDeal(el.dataset.id, el); break;
      case "dispute":
        if (!state.disputeArmed) { state.disputeArmed = true; TG.haptic("warning"); refreshDeal(true); }
        else dealAction(el.dataset.id, "dispute", el);
        break;
      case "copy-link": copyLink(el.dataset.link); break;
      case "share-link": TG.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(el.dataset.link) + "&text=" + encodeURIComponent(el.dataset.text)); break;
      case "open-user": TG.openTelegramLink("https://t.me/" + el.dataset.username); break;
      case "deals-view": state.deals.view = el.dataset.view; TG.haptic("select"); renderDeals(); break;

      /* форми продажу */
      case "pick-gift": {
        const sc = el.dataset.scope; state[sc].selected = el.dataset.slug; TG.haptic("select"); renderPicker(sc);
        if (sc === "ex") { const b = $("#ex-start"); if (b) b.disabled = false; }
        break;
      }
      case "set-opt": {
        const { scope, key, value } = el.dataset;
        state[scope][key] = value;
        TG.haptic("select");
        if (scope === "sell") renderSell(); else if (scope === "priv") renderPrivate();
        else if (scope === "ex") { renderExTopup(); renderExSheetSummary(); const i = $("#ex-topup-amount"); if (i) i.focus(); }
        break;
      }
      case "pick-want": openWantSheet(); break;
      case "submit-exchange": submitExchange(el); break;
      case "create-exchange": Object.assign(state.sell, { type: "exchange" }); setTab("sell"); break;
      case "start-exchange": startExchange(el.dataset.id, el); break;
      case "open-swap": TG.haptic("light"); openSwap(el.dataset.id); break;
      case "swap": swapAction(el.dataset.id, el.dataset.act, el); break;
      case "swap-pay": swapAction(el.dataset.id, "pay", el); break;
      case "swap-dispute":
        if (!state.disputeArmed) { state.disputeArmed = true; TG.haptic("warning"); refreshSwap(true); }
        else swapAction(el.dataset.id, "dispute", el);
        break;
      case "set-currency": {
        const sc = el.dataset.scope;
        state[sc].currency = el.dataset.cur;
        TG.haptic("select");
        document.querySelectorAll(`[data-action="set-currency"][data-scope="${sc}"]`).forEach((b) => b.classList.toggle("is-active", b === el));
        document.querySelectorAll(`.cur-suffix[data-scope="${sc}"]`).forEach((x) => { x.textContent = el.dataset.cur; });
        renderSummary(sc);
        break;
      }
      case "sell-type": state.sell.type = el.dataset.type; TG.haptic("select"); renderSell(); break;
      case "sell-dur":
        if (el.dataset.h === "custom") state.sell.customDur = true;
        else Object.assign(state.sell, { customDur: false, durationH: +el.dataset.h });
        TG.haptic("select"); renderSell();
        break;
      case "toggle-offers": state.sell.allowOffers = !state.sell.allowOffers; TG.haptic("select"); renderSell(); break;
      case "submit-listing": submitListing(el); break;
      case "priv-mode": state.priv.mode = el.dataset.mode; TG.haptic("select"); renderPrivate(); break;
      case "submit-private": submitPrivate(el); break;
      case "cancel-listing":
        e.stopPropagation();
        el.disabled = true;
        API.cancelListing(el.dataset.id)
          .then(() => { toast(t("lot.removed"), "ok"); state.sell.gifts = null; loadMyListings(); })
          .catch((err) => { toast(err.message, "err"); el.disabled = false; });
        break;
    }
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches(".nft-card")) e.target.click(); });

  /* =============== ВВЕДЕННЯ =============== */
  let searchDebounce = null;
  document.addEventListener("input", (e) => {
    const el = e.target, id = el.id;
    if (id === "market-search") {
      state.market.q = el.value;
      const clr = document.querySelector('[data-action="search-clear"]'); if (clr) clr.hidden = !el.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(loadListings, 250);
    } else if (el.dataset.scope && el.dataset.key) {
      state[el.dataset.scope][el.dataset.key] = el.value;
      renderSummary(el.dataset.scope);
    } else if (id === "sell-hours") { state.sell.hours = el.value; renderSummary("sell"); }
    else if (id === "priv-username") state.priv.username = el.value.replace(/^@+/, "");
    else if (el.classList.contains("sheet-search")) {
      const q = el.value.trim().toLowerCase();
      document.querySelectorAll(el.dataset.target + " [data-name]").forEach((o) => { o.hidden = q && !o.dataset.name.includes(q); });
    } else if (id === "range-min" && state.draft) state.draft.min = el.value;
    else if (id === "range-max" && state.draft) state.draft.max = el.value;
    else if (id === "bid-amount") updateBidFrozen();
  });

  /* =============== СТАРТ =============== */
  TG.init();
  I18N.setLang(I18N.lang);
  $("#lang-pill").innerHTML = `${UI.ei("globe")}<span>${I18N.LANGS[I18N.lang].short}</span>`;
  document.querySelectorAll(".tab__em").forEach((el) => { el.innerHTML = TE.svg(el.dataset.em); });
  $("#topbar-avatar").innerHTML = avatarInner(TG.user);
  UI.particles();
  setTab("market");
  refreshBadges();
  if (C.MOCK) {
    setInterval(refreshBadges, 15000);
    setInterval(pollEvents, 3000);
  } else {
    setInterval(livePoll, (C.POLL_SEC || 10) * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) livePoll(); });
  }
  // Живі таймери: аукціони, угоди
  setInterval(() => {
    document.querySelectorAll("[data-ends]").forEach((el) => {
      const ms = +el.dataset.ends - Date.now();
      el.textContent = ms > 0 ? countdown(+el.dataset.ends) : el.classList.contains("timer__val") ? "00:00" : t("auction.ended");
      el.classList.toggle("is-urgent", ms > 0 && ms < 5 * 60000);
    });
  }, 1000);

  // Відкрито за посиланням на угоду: t.me/bot/app?startapp=deal_D-1234
  const sp = TG.startParam;
  if (sp && sp.startsWith("deal_")) openDeal(sp.slice(5));
})();

</script>
</body>
</html>
