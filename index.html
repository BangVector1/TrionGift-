  }

  async function loadMarketMeta() {
    const m = state.market;
    try {
      const [stats, sales] = await Promise.all([API.stats(), m.sales ? Promise.resolve(m.sales) : API.recentSales()]);
      m.stats = stats; m.sales = sales;
    } catch (e) { return; }
    if (state.tab !== "market") return;
    UI.countUp($("#st-lots"), m.stats.listings);
    UI.countUp($("#st-deals"), m.stats.deals24h, 1200);
    const ac = $("#auc-count"); if (ac && m.stats.auctions) ac.textContent = m.stats.auctions;
    const xc = $("#ex-count"); if (xc && m.stats.exchanges) xc.textContent = m.stats.exchanges;
    const item = (s) => `<span class="ticker__item">${nftArt(s.gift, "xs")}<b>${esc(nftName(s.gift))}</b> ${t("ticker.sold")} ${price(s.price, s.currency)} <i>${timeAgo(s.at)}</i></span>`;
    const html = m.sales.map(item).join("");
    const track = $("#ticker-track");
    if (track) track.innerHTML = html + html;
  }

  function renderFilterBar() {
    const el = $("#filter-bar");
    if (!el) return;
    const m = state.market, cat = state.catalog;
    const colLabel = () => {
      if (m.collections.length === 1 && cat) { const c = cat.collections.find((x) => x.id === m.collections[0]); if (c) return `<span class="fbtn__gi">${GI.gift(c.id)}</span><span class="fbtn__t">${esc(c.name)}</span>`; }
      return m.collections.length ? `${t("filter.collection")} <span class="fbtn__n">${m.collections.length}</span>` : t("filter.collection");
    };
    const bdDots = cat ? m.backdrops.slice(0, 3).map((n) => { const b = cat.backdrops.find((x) => x.name === n); return b ? `<i class="dot" style="background:linear-gradient(135deg,${b.colors[0]},${b.colors[1]})"></i>` : ""; }).join("") : "";
    const bdLabel = m.backdrops.length === 1 ? `<span class="fbtn__t">${esc(m.backdrops[0])}</span>` : m.backdrops.length ? `${t("filter.backdrop")} <span class="fbtn__n">${m.backdrops.length}</span>` : t("filter.backdrop");
    const priceLabel = m.sort === "cheap" ? `${t("filter.price")} ↑` : m.sort === "expensive" ? `${t("filter.price")} ↓` : m.currency !== "all" ? `${t("filter.price")} · ${m.currency}` : t("filter.price");
    el.innerHTML = `
      <button class="fbtn ${m.collections.length ? "is-on" : ""}" data-action="filter-collection">${colLabel()}${ICONS.down}</button>
      <button class="fbtn ${m.sort !== "random" || m.currency !== "all" ? "is-on" : ""}" data-action="filter-price">${priceLabel}${ICONS.down}</button>
      <button class="fbtn ${m.backdrops.length ? "is-on" : ""}" data-action="filter-backdrop">${bdDots}${bdLabel}${ICONS.down}</button>
      <button class="fbtn fbtn--icon" data-action="shuffle" aria-label="${t("filter.shuffle")}" title="${t("filter.shuffle")}">${UI.ei("dice")}</button>
      ${filtersActive() ? `<button class="fbtn fbtn--reset" data-action="reset-filters">${ICONS.x}</button>` : ""}`;
  }

  let listingsReq = 0;
  async function loadListings(quiet) {
    const grid = $("#market-grid");
    if (!grid) return;
    const req = ++listingsReq;
    if (!quiet) grid.innerHTML = Array(4).fill('<div class="skeleton"></div>').join("");
    try {
      const [items] = await Promise.all([API.listings(marketParams()), getCatalog()]);
      if (req !== listingsReq || !$("#market-grid")) return;
      const m = state.market;
      const searching = m.q || filtersActive();
      $("#market-count").innerHTML = searching ? t("search.found", { n: items.length }) : m.sort === "random" ? `${UI.ei("dice", "ei--inline")} ${t("market.random")}` : "";
      renderHot(searching || m.mode === "exchange" ? [] : items);
      const cta = m.mode === "exchange" ? `<button class="ex-cta" data-action="create-exchange"><span class="ex-cta__ic">${UI.ei("handshake")}</span><span><b>${t("ex.submit")}</b><small>${t("ex.publicSub")}</small></span><span class="ex-cta__plus">+</span></button>` : "";
      grid.innerHTML = items.length
        ? cta + items.map((l, i) => (l.type === "exchange" ? exCard(l, i) : nftCard(l, i))).join("")
        : `<div class="empty" style="grid-column:1/-1"><div class="empty__icon">${UI.ei("void")}</div>${t("market.empty")}
             <div class="mt-16"><button class="btn btn--ghost btn--sm" data-action="reset-all">${t("market.resetAll")}</button></div></div>`;
    } catch (e) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)}</div>`;
    }
  }

  // Фікс. ціна → найрідкісніші; аукціони → ті, що скоро завершаться
  function renderHot(items) {
    const el = $("#hot-wrap");
    if (!el) return;
    if (!items.length) { el.innerHTML = ""; return; }
    const auction = state.market.mode === "auction";
    const hot = [...items].sort(auction ? (a, b) => a.endsAt - b.endsAt : (a, b) => a.gift.attrs.model.rarity - b.gift.attrs.model.rarity).slice(0, 6);
    el.innerHTML = `
      <div class="section-head"><h2 class="h2"><span class="flame">${UI.ei(auction ? "hourglass" : "flame")}</span> ${auction ? t("market.ending") : t("market.hot")}</h2></div>
      <div class="hot-row">${hot.map((l, i) => nftCard(l, i, true)).join("")}</div>`;
  }

  function nftCard(l, i, hot) {
    const g = l.gift;
    const fav = state.favs.has(l.id);
    const auction = l.type === "auction";
    const rare = g.attrs.model.rarity < 1;
    const extra = `
      <span class="nft-art__badge">#${g.number}</span>
      <button class="fav ${fav ? "is-on" : ""}" data-action="fav" data-id="${l.id}" aria-label="fav">${ICONS.heart}</button>
      ${auction ? `<span class="live-badge"><i></i>${t("auction.live")}</span><span class="ends-chip" data-ends="${l.endsAt}">${countdown(l.endsAt)}</span>` : ""}
      ${!auction && rare ? `<span class="rare-tag">${UI.ei("sparkle", "ei--tag")}${l.allowOffers ? "" : t("rare") + " "}${g.attrs.model.rarity}%</span>` : ""}
      ${!auction && l.allowOffers ? `<span class="offer-tag">${UI.ei("handshake", "ei--tag")}${t("offer.tag")}</span>` : ""}
      ${l.feePayer === "seller" ? `<span class="nofee-tag ${!auction && l.allowOffers ? "is-up" : ""}">${t("nofee")}</span>` : ""}`;
    const leading = auction && l.leaderId === ME();
    return `
    <div class="nft-card ${hot ? "nft-card--hot" : ""} ${auction ? "nft-card--auction" : ""}" role="button" tabindex="0"
         style="--i:${Math.min(i, 12)};--art-a:${g.colors[0]};--art-b:${g.colors[1]}" data-action="open-listing" data-id="${l.id}">
      ${nftArt(g, "", extra)}
      <div class="nft-card__body">
        <div class="nft-card__name">${esc(g.collection)}</div>
        <div class="nft-card__num"><i class="dot" style="background:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})"></i>${esc(g.attrs.model.name)} · ${esc(g.attrs.backdrop.name)}</div>
        ${auction ? `<div class="nft-card__meta">${UI.ei("gavel", "ei--inline")} ${t("auction.bids", { n: l.bids.length })}${leading ? ` · ${UI.ei("crown", "ei--inline")}` : ""}</div>` : ""}
        <div class="nft-card__row">
          ${price(l.price, l.currency)}
          <span class="nft-card__buy">${auction ? t("auction.bid") : t("card.buy")}</span>
        </div>
      </div>
    </div>`;
  }

  /* ---------- Шторки фільтрів ---------- */
  const sheetFooter = (applyAction) => `
    <div class="sheet__footer">
      <button class="btn btn--ghost" data-action="draft-reset">${t("filter.reset")}</button>
      <button class="btn btn--primary" data-action="${applyAction}">${t("filter.apply")}</button>
    </div>`;

  async function openCollectionSheet() {
    sheet(`<h2 class="h2">${t("filter.collectionsTitle")}</h2><div class="skeleton mt-16" style="aspect-ratio:3"></div>`);
    state.draft = { kind: "collections", values: [...state.market.collections] };
    const [cat, f] = await Promise.all([getCatalog(), API.facets(marketParams())]);
    if (!state.draft || state.draft.kind !== "collections") return;
    // УСІ колекції — навіть ті, яких зараз немає в продажу
    const opts = cat.collections.map((c) => ({ ...c, count: f.collections[c.id] || 0 })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    const d = state.draft;
    setSheet(`
      <h2 class="h2">${t("filter.collectionsTitle")} <span class="muted small">${opts.length}</span></h2>
      <label class="search mt-12">${ICONS.search}<input class="sheet-search" data-target="#opt-list" type="search" placeholder="${t("filter.collectionSearch")}" autocomplete="off" /></label>
      <div class="opt-list mt-12" id="opt-list">
        ${opts.map((o) => `
          <button class="option ${d.values.includes(o.id) ? "is-active" : ""} ${o.count ? "" : "option--empty"}" data-action="draft-toggle" data-value="${esc(o.id)}" data-name="${esc(o.name.toLowerCase())}">
            <span class="option__box">${ICONS.check}</span><span class="option__art">${GI.gift(o.id)}</span><span class="option__label">${esc(o.name)}</span><span class="option__count">${o.count}</span>
          </button>`).join("")}
      </div>
      ${sheetFooter("apply-draft")}`);
  }

  async function openBackdropSheet() {
    sheet(`<h2 class="h2">${t("filter.backdropsTitle")}</h2><div class="skeleton mt-16" style="aspect-ratio:3"></div>`);
    state.draft = { kind: "backdrops", values: [...state.market.backdrops] };
    const [cat, f] = await Promise.all([getCatalog(), API.facets(marketParams())]);
    if (!state.draft || state.draft.kind !== "backdrops") return;
    // УСІ фони — навіть ті, яких зараз немає в продажу
    const opts = cat.backdrops.map((b) => ({ ...b, count: f.backdrops[b.name] || 0 })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    const d = state.draft;
    setSheet(`
      <h2 class="h2">${t("filter.backdropsTitle")} <span class="muted small">${opts.length}</span></h2>
      <label class="search mt-12">${ICONS.search}<input class="sheet-search" data-target="#opt-list" type="search" placeholder="${t("filter.backdropSearch")}" autocomplete="off" /></label>
      <div class="swatches opt-list mt-12" id="opt-list">
        ${opts.map((o) => `
          <button class="swatch ${d.values.includes(o.name) ? "is-active" : ""} ${o.count ? "" : "option--empty"}" data-action="draft-toggle" data-value="${esc(o.name)}" data-name="${esc(o.name.toLowerCase())}">
            <span class="swatch__color" style="background:radial-gradient(circle at 50% 38%,${o.colors[0]},${o.colors[1]})">${ICONS.check}</span>
            <span class="swatch__name">${esc(o.name)}</span><span class="swatch__count">${o.count}</span>
          </button>`).join("")}
      </div>
      ${sheetFooter("apply-draft")}`);
  }

  function openPriceSheet() {
    sheet("");
    const m = state.market;
    state.draft = { kind: "price", sort: m.sort, currency: m.currency, min: m.min, max: m.max };
    renderPriceSheet();
  }
  function renderPriceSheet() {
    const d = state.draft;
    const sorts = [["random", UI.ei("dice", "ei--inline")], ["cheap", "↑"], ["expensive", "↓"]];
    const curs = ["all", ...Object.keys(C.CURRENCIES)];
    setSheet(`
      <h2 class="h2">${t("filter.priceTitle")}</h2>
      <span class="field__label" style="margin-top:18px">${t("filter.sort")}</span>
      ${sorts.map(([s, ic]) => `
        <button class="option ${d.sort === s ? "is-active" : ""}" data-action="draft-sort" data-value="${s}">
          <span class="option__tag">${ic}</span><span class="option__label">${t("sort." + s)}</span><span class="option__check">${ICONS.check}</span>
        </button>`).join("")}
      <span class="field__label" style="margin-top:18px">${t("filter.currency")}</span>
      <div class="segment" style="margin-top:0">
        ${curs.map((c) => `<button class="segment__btn ${d.currency === c ? "is-active" : ""}" data-action="draft-currency" data-value="${c}">${c === "all" ? t("all") : UI.curIcon(c) + " " + c}</button>`).join("")}
      </div>
      <span class="field__label" style="margin-top:18px">${t("filter.range")}</span>
      ${d.currency === "all"
        ? `<div class="card small muted">${t("filter.rangeHint")}</div>`
        : `<div class="range">
             <div class="input-wrap"><input class="input" id="range-min" type="number" inputmode="decimal" placeholder="${t("filter.from")}" value="${esc(d.min)}" /></div>
             <span class="range__dash">—</span>
             <div class="input-wrap"><input class="input" id="range-max" type="number" inputmode="decimal" placeholder="${t("filter.to")}" value="${esc(d.max)}" /></div>
           </div>`}
      ${sheetFooter("apply-draft")}`);
  }

  function applyDraft() {
    const m = state.market, d = state.draft;
    if (!d) return;
    if (d.kind === "want") { state.sell.wantCols = d.values; closeSheet(); renderSell(); return; }
    if (d.kind === "collections") m.collections = d.values;
    if (d.kind === "backdrops") m.backdrops = d.values;
    if (d.kind === "price") Object.assign(m, { sort: d.sort, currency: d.currency, min: d.currency === "all" ? "" : d.min, max: d.currency === "all" ? "" : d.max });
    closeSheet();
    TG.haptic("medium");
    renderFilterBar();
    loadListings();
  }

  /* =============== ЛОТ: ФІКСОВАНА ЦІНА + ТОРГ =============== */
  async function openListing(id) {
    sheet(`<div class="skeleton" style="aspect-ratio:1;max-width:290px;margin:0 auto"></div>`);
    let l;
    try { l = await API.listing(id); } catch (e) { closeSheet(); return toast(e.message, "err"); }
    if (l.type === "auction") { state.sheetCtx = { kind: "auction", id }; renderAuctionSheet(l); sheetPoll = setInterval(refreshAuction, SHEET_POLL_MS); return; }
    if (l.type === "exchange") return renderExchangeSheet(l);
    renderFixedSheet(l);
  }

  const attrBox = (k, a, sw) => `<div class="attr">${sw ? `<i class="attr__sw" style="background:linear-gradient(135deg,${a.colors[0]},${a.colors[1]})"></i>` : ""}<div class="attr__k">${k}</div><div class="attr__v">${esc(a.name)}</div><div class="attr__r">${a.rarity}%</div></div>`;
  const nftHeader = (l, extraBadge = "") => {
    const g = l.gift;
    return `
      <div class="art-stage ${l.type === "auction" || l.type === "exchange" ? "art-stage--compact" : ""}" style="--art-a:${g.colors[0]}">${nftArt(g, "lg", `<span class="nft-art__badge">#${g.number}</span>${extraBadge}`)}</div>
      <div class="row between mt-16">
        <div style="min-width:0">
          <h2 class="h1" style="font-size:22px">${esc(g.collection)}</h2>
          <div class="muted small ellipsis">#${g.number} · t.me/nft/${esc(g.slug)}</div>
        </div>
        <button class="fav fav--lg ${state.favs.has(l.id) ? "is-on" : ""}" data-action="fav" data-id="${l.id}" aria-label="fav">${ICONS.heart}</button>
      </div>
      <div class="attrs mt-16">${attrBox(t("nft.model"), g.attrs.model)}${attrBox(t("nft.backdrop"), g.attrs.backdrop, true)}${attrBox(t("nft.symbol"), g.attrs.symbol)}</div>
      <div class="card mt-12">
        <div class="list-item">
          <div class="avatar">${esc((l.seller.name || l.seller.username || "?")[0])}</div>
          <div class="list-item__main">
            <div class="list-item__title">@${esc(l.seller.username)}</div>
            <div class="list-item__sub">${t("seller.line", { n: l.seller.deals, r: "§" }).replace("§", UI.ei("star", "ei--inline") + " " + l.seller.rating)}</div>
          </div>
        </div>
      </div>`;
  };

  function renderFixedSheet(l) {
    const own = l.seller.id === ME();
    let offerBlock = "";
    if (l.allowOffers && !own) {
      const o = l.myOffer;
      if (o && o.status === "pending") {
        offerBlock = `<div class="mt-12">${note(t("offer.pendingHere", { sum: sum(o.amount, o.currency) }), "info")}
          <div class="mt-8"><button class="btn btn--ghost btn--sm" data-action="offer-act" data-id="${o.id}" data-act="cancel">${t("offer.cancel")}</button></div></div>`;
      } else if (o && o.status === "countered") {
        offerBlock = `<div class="card offer-box mt-12">
          <div class="offer-box__head">${UI.ei("handshake", "ei--md")}<b>${t("offer.counterHere", { sum: sum(o.counter, o.currency) })}</b></div>
          <div class="btn-row mt-12">
            <button class="btn btn--ghost btn--sm" data-action="offer-act" data-id="${o.id}" data-act="decline">${t("offer.decline")}</button>
            <button class="btn btn--primary btn--sm" data-action="offer-act" data-id="${o.id}" data-act="accept">${t("offer.acceptSum", { sum: sum(o.counter, o.currency) })}</button>
          </div></div>`;
      } else {
        const sugg = [5, 10, 15, 20].map((k) => ({ k, v: Math.round(l.price * (1 - k / 100) * 100) / 100 })).filter((s) => !l.minOffer || s.v >= l.minOffer);
        offerBlock = `
          <div class="card offer-box mt-12">
            <div class="offer-box__head">${UI.ei("offer")}<b>${t("offer.make")}</b></div>
            <div class="small muted mt-8">${t("offer.hint")}${l.minOffer ? ` <b class="accent">${t("offer.min", { sum: sum(l.minOffer, l.currency) })}</b>` : ""}</div>
            <div class="input-wrap mt-12">
              <input class="input input--price" id="offer-price" type="number" inputmode="decimal" placeholder="${t("offer.yourPrice")}" />
              <span class="input-wrap__suffix">${esc(l.currency)}</span>
            </div>
            ${sugg.length ? `<div class="quick-row mt-8">${sugg.map((s) => `<button class="quick" data-action="offer-quick" data-v="${s.v}">−${s.k}% · ${UI.fmtNum(s.v, l.currency)}</button>`).join("")}</div>` : ""}
            <button class="btn btn--ghost mt-12" data-action="send-offer" data-id="${l.id}">${ICONS.hand} ${t("offer.send")}</button>
          </div>`;
      }
    }

    setSheet(`
      ${nftHeader(l, l.allowOffers ? `<span class="offer-tag">${UI.ei("handshake", "ei--tag")}${t("offer.tag")}</span>` : "")}
      <div class="card mt-12">
        <div class="kv"><span>${t("price")}</span>${price(l.price, l.currency)}</div>
        <div class="kv"><span>${t("fee.line", { p: C.FEE_PERCENT, who: payerLabel(l.feePayer) })}</span>${l.buyerFee ? price(l.buyerFee, l.currency) : `<b class="ok-text">${t("nofee")}</b>`}</div>
        <div class="kv kv--total"><span>${t("toPay")}</span>${price(l.total, l.currency)}</div>
      </div>
      ${offerBlock}
      <details class="card mt-12 how">
        <summary class="row">${UI.ei("escrow")}<b>${t("how.title")}</b></summary>
        <ol class="how__list small muted"><li>${t("how.1")}</li><li>${t("how.2")}</li><li>${t("how.3")}</li><li>${t("how.4")}</li></ol>
      </details>
      <div class="sheet__footer">
        ${own ? `<button class="btn btn--ghost" disabled>${t("own")}</button>`
              : `<button class="btn btn--primary btn--glow" data-action="buy" data-id="${l.id}">${t("buyFor", { sum: sum(l.total, l.currency) })}</button>`}
      </div>`);
  }

  async function buy(id, btn) {
    btn.disabled = true;
    btn.textContent = t("creatingDeal");
    try {
      const deal = await API.createDeal(id);
      TG.haptic("success");
      openDeal(deal.id);
      refreshBadges();
      if (state.tab === "market") loadListings(true);
    } catch (e) {
      toast(e.message, "err");
      btn.disabled = false;
      btn.textContent = t("retry");
    }
  }

  async function sendOffer(id, btn) {
    const v = parseFloat($("#offer-price").value);
    if (!(v > 0)) return toast(t("err.badPrice"), "err");
    btn.disabled = true;
    try {
      await API.makeOffer(id, v);
      toast(t("offer.sent"), "ok", "handshake");
      openListing(id);
      refreshBadges();
    } catch (e) { toast(e.message, "err"); btn.disabled = false; }
  }

  async function offerAct(id, act, btn) {
    if (btn) btn.disabled = true;
    try {
      const o = await API.offerAction(id, act);
      TG.haptic("medium");
      if (o.status === "accepted" && o.dealId) { openDeal(o.dealId); }
      else if (state.sheetCtx == null && sheetOpen() && o.listingId && o.role === "buyer") openListing(o.listingId);
      if (state.tab === "deals") loadDealsView();
      refreshBadges();
    } catch (e) { toast(e.message, "err"); if (btn) btn.disabled = false; }
  }

  function openCounterSheet(o) {
    const lo = Math.round((o.amount + 0.01) * 100) / 100, hi = Math.round((o.listPrice - 0.01) * 100) / 100;
    const mid = Math.round(((o.amount + o.listPrice) / 2) * 100) / 100;
    const p90 = Math.round(o.listPrice * 0.95 * 100) / 100;
    sheet(`
      <h2 class="h2">${UI.ei("offer")} ${t("offer.counterTitle")}</h2>
      <div class="list-item mt-16">${nftArt(o.gift, "sm")}<div class="list-item__main"><div class="list-item__title">${esc(nftName(o.gift))}</div>
        <div class="list-item__sub">${t("offer.offer")}: ${esc(sum(o.amount, o.currency))} · ${t("offer.listPrice")}: ${esc(sum(o.listPrice, o.currency))}</div></div></div>
      <div class="input-wrap mt-16">
        <input class="input input--price" id="counter-price" type="number" inputmode="decimal" value="${mid}" />
        <span class="input-wrap__suffix">${esc(o.currency)}</span>
      </div>
      <div class="small muted mt-8">${t("offer.counterHint", { a: sum(lo, o.currency), b: sum(hi, o.currency) })}</div>
      <div class="quick-row mt-8">
        <button class="quick" data-action="counter-quick" data-v="${mid}">½ · ${UI.fmtNum(mid, o.currency)}</button>
        ${p90 < o.listPrice && p90 > o.amount ? `<button class="quick" data-action="counter-quick" data-v="${p90}">−5% · ${UI.fmtNum(p90, o.currency)}</button>` : ""}
      </div>
      <div class="sheet__footer"><button class="btn btn--primary btn--glow" data-action="send-counter" data-id="${o.id}">${t("offer.counterSend")}</button></div>`);
  }

  async function sendCounter(id, btn) {
    btn.disabled = true;
    try {
      await API.offerAction(id, "counter", parseFloat($("#counter-price").value));
      TG.haptic("medium");
      closeSheet();
      if (state.tab === "deals") loadDealsView();
      refreshBadges();
    } catch (e) { toast(e.message, "err"); btn.disabled = false; }
  }

  /* =============== АУКЦІОН =============== */
  function renderAuctionSheet(l) {
    const own = l.seller.id === ME();
    const active = l.status === "active" && l.endsAt > Date.now();
    const bidBox = active && !own && l.leaderId !== ME() ? `
      <div class="card bid-box mt-12" id="bid-box">
        <span class="field__label" style="margin:0 0 8px">${t("auction.yourBid")}</span>
        <div class="input-wrap">
          <input class="input input--price" id="bid-amount" type="number" inputmode="decimal" value="${l.minBid}" min="${l.minBid}" />
          <span class="input-wrap__suffix">${esc(l.currency)}</span>
        </div>
        <div class="quick-row mt-8" id="bid-quick">${bidQuick(l)}</div>
        <div class="kv mt-8"><span>${t("auction.frozen")}</span><span id="bid-frozen">${price(API.calcFee(l.minBid, l.feePayer).total, l.currency)}</span></div>
        <div class="mt-8">${note(t("auction.note", { p: C.FEE_PERCENT, s: C.AUCTION_ANTI_SNIPE_SEC }), "info")}</div>
      </div>` : "";
    setSheet(`
      ${nftHeader(l, `<span class="live-badge live-badge--lg ${active ? "" : "is-off"}"><i></i>${active ? t("auction.live") : t("auction.ended")}</span>`)}
      <div id="auc-panel">${auctionPanel(l)}</div>
      ${bidBox}
      <div class="section-head"><h2 class="h2">${UI.ei("gavel")} ${t("auction.history")}</h2></div>
      <div id="auc-history">${bidHistory(l)}</div>
      <div class="sheet__footer" id="auc-footer">${auctionFooter(l)}</div>`);
    state.sheetCtx.data = l;
  }

  const bidQuick = (l) => [0, 10, 25].map((k) => {
    const v = Math.ceil(l.minBid * (1 + k / 100) * 100) / 100;
    return `<button class="quick" data-action="bid-quick" data-v="${v}">${k ? "+" + k + "%" : "min"} · ${UI.fmtNum(v, l.currency)}</button>`;
  }).join("");

  function auctionPanel(l) {
    const active = l.status === "active" && l.endsAt > Date.now();
    const leading = l.leaderId === ME();
    const winner = l.bids.length ? l.bids[l.bids.length - 1] : null;
    return `
      <div class="auc-panel mt-12">
        <div class="auc-panel__cell">
          <span class="auc-label">${l.bids.length ? t("auction.currentBid") : t("auction.startPrice")}</span>
          ${price(l.price, l.currency, true)}
          <em>${t("auction.bids", { n: l.bids.length })} · ${t("auction.step")} +${C.AUCTION_MIN_STEP_PERCENT}%</em>
        </div>
        <div class="auc-panel__cell auc-panel__cell--timer">
          <span class="auc-label">${active ? t("auction.endsIn") : t("auction.ended")}</span>
          <b class="auc-timer" ${active ? `data-ends="${l.endsAt}"` : ""}>${active ? countdown(l.endsAt) : "00:00"}</b>
          <em>${active ? t("auction.minBid", { sum: sum(l.minBid, l.currency) }) : winner ? t("auction.endedWon", { u: winner.username, sum: sum(winner.amount, l.currency) }) : t("auction.endedNoBids")}</em>
        </div>
      </div>
      ${leading && active ? `<div class="lead-banner mt-8">${UI.ei("crown")} ${t("auction.youLead")}</div>` : ""}`;
  }

  function bidHistory(l) {
    if (!l.bids.length) return `<div class="card small muted" style="text-align:center">${t("auction.noBids")}</div>`;
    return `<div class="card bid-list">${[...l.bids].reverse().slice(0, 10).map((b, i) => `
      <div class="bid-row ${i === 0 ? "is-top" : ""} ${b.userId === ME() ? "is-me" : ""}">
        <span class="bid-row__ava">${i === 0 ? UI.ei("crown") : esc((b.username || "?")[0].toUpperCase())}</span>
        <span class="bid-row__user">@${esc(b.username)}${i === 0 ? ` <i>${t("auction.leader")}</i>` : ""}</span>
        <span class="bid-row__time">${timeAgo(b.at)}</span>
        ${price(b.amount, l.currency)}
      </div>`).join("")}</div>`;
  }

  function auctionFooter(l) {
    const own = l.seller.id === ME();
    const active = l.status === "active" && l.endsAt > Date.now();
    if (own) return `<button class="btn btn--ghost" disabled>${ICONS.gavel} ${t("auction.own")}</button>`;
    if (!active) return `<button class="btn btn--ghost" disabled>${t("auction.ended")}</button>`;
    if (l.leaderId === ME()) return ""; // лідер — замість кнопки банер «Ви лідируєте»
    const v = parseFloat(($("#bid-amount") || {}).value) || l.minBid;
    return `<button class="btn btn--primary btn--glow" data-action="place-bid" data-id="${l.id}" id="bid-btn">${ICONS.gavel} ${t("auction.place", { sum: sum(v, l.currency) })}</button>`;
  }

  async function refreshAuction(force) {
    const ctx = state.sheetCtx;
    if (!ctx || ctx.kind !== "auction" || !sheetOpen()) return;
    let l;
    try { l = await API.listing(ctx.id); } catch (e) { return; }
    if (!state.sheetCtx || state.sheetCtx.id !== ctx.id) return;
    const prev = ctx.data;
    const changed = force || !prev || prev.bids.length !== l.bids.length || prev.endsAt !== l.endsAt || prev.status !== l.status;
    if (!changed) return;
    const wasActive = prev && prev.status === "active";
    if (prev && wasActive && l.status !== "active") { renderAuctionSheet(l); return; } // аукціон завершився
    ctx.data = l;
    $("#auc-panel").innerHTML = auctionPanel(l);
    $("#auc-history").innerHTML = bidHistory(l);
    const inp = $("#bid-amount");
    const needBox = l.status === "active" && l.seller.id !== ME() && l.leaderId !== ME();
    if (!!inp !== needBox) { renderAuctionSheet(l); return; } // з'явився/зник блок ставки
    if (inp) {
      inp.min = l.minBid;
      if (document.activeElement !== inp && (parseFloat(inp.value) || 0) < l.minBid) inp.value = l.minBid;
      $("#bid-quick").innerHTML = bidQuick(l);
      updateBidFrozen();
    }
    $("#auc-footer").innerHTML = auctionFooter(l);
    if (prev && l.bids.length > prev.bids.length) { const p = $("#auc-panel .price--lg"); if (p) { p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); } }
  }

  function updateBidFrozen() {
    const l = state.sheetCtx && state.sheetCtx.data;
    const inp = $("#bid-amount");
    if (!l || !inp) return;
    const v = parseFloat(inp.value) || 0;
    const fz = $("#bid-frozen"); if (fz) fz.innerHTML = price(API.calcFee(v, l.feePayer).total, l.currency);
    const btn = $("#bid-btn"); if (btn) btn.innerHTML = `${ICONS.gavel} ${t("auction.place", { sum: sum(v, l.currency) })}`;
  }

  async function placeBid(id, btn) {
    const v = parseFloat($("#bid-amount").value);
    btn.disabled = true;
    btn.textContent = t("auction.placing");
    try {
      const res = await API.placeBid(id, v);
      if (res && res.payUrl) TG.openTelegramLink(res.payUrl); // реально: оплата ставки в @send
      toast(t("auction.placed"), "ok", "gavel");
      TG.haptic("success");
      const l = await API.listing(id);
      state.sheetCtx = { kind: "auction", id };
      renderAuctionSheet(l);
      refreshBadges();
      if (state.tab === "market") loadListings(true);
    } catch (e) {
      toast(e.message, "err");
      btn.disabled = false;
      updateBidFrozen();
    }
  }

  function toggleFav(id) {
    const on = !state.favs.has(id);
    on ? state.favs.add(id) : state.favs.delete(id);
    saveFavs();
    document.querySelectorAll(`.fav[data-id="${id}"]`).forEach((b) => {
      b.classList.toggle("is-on", on);
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    });
    TG.haptic(on ? "medium" : "light");
    if (on) toast(t("fav.add"), "", "heart");
  }

  /* =============== УГОДА (шторка) =============== */
  let lastDealKey = "";
  async function openDeal(id) {
    sheet(`<div class="skeleton" style="aspect-ratio:2"></div>`, () => {
      if (state.tab === "deals") loadDealsView();
      if (state.tab === "private") loadPrivateLists();
    });
    state.sheetCtx = { kind: "deal", id };
    state.disputeArmed = false;
    lastDealKey = "";
    await refreshDeal();
    stopPoll();
    sheetPoll = setInterval(refreshDeal, SHEET_POLL_MS); // бекенд змінює статус сам (вебхук оплати, перевірка NFT, таймаути)
  }

  async function refreshDeal(force) {
    const ctx = state.sheetCtx;
    if (!ctx || ctx.kind !== "deal") return;
    let d;
    try { d = await API.deal(ctx.id); } catch (e) { return; }
    if (!state.sheetCtx || state.sheetCtx.id !== ctx.id || !sheetOpen()) return;
    const key = d.status + "|" + d.history.length + "|" + state.disputeArmed;
    if (key === lastDealKey && force !== true) return;
    const prevStatus = lastDealKey.split("|")[0];
    const statusChanged = lastDealKey && d.status !== prevStatus;
    lastDealKey = key;
    setSheet(dealView(d));
    if (statusChanged) {
      $("#sheet").scrollTop = 0;
      TG.haptic(d.status === "completed" ? "success" : "medium");
      refreshBadges();
      if (d.status === "completed") { UI.confetti(); toast(t("deal.done"), "ok", "party"); }
    }
  }

  const STEPS = ["paid", "accepted", "sent", "verified", "completed"];
  const STEP_INDEX = { awaiting_payment: 0, paid: 1, accepted: 2, sent: 3, completed: 5 };
  const SRC_ICON = { private: UI.ei("lock"), auction: UI.ei("gavel"), offer: UI.ei("offer") };
  const srcBadge = (d) => d.source && d.source !== "market"
    ? `<span class="badge badge--lock">${SRC_ICON[d.source]}${d.source === "private" ? t("deal.private") : t("src." + d.source)}</span>` : "";

  function timeline(d) {
    const failed = ["refunded", "cancelled"].includes(d.status);
    let at = STEP_INDEX[d.status];
    if (at === undefined) {
      const lastLive = [...d.history].reverse().find((h) => STEP_INDEX[h.status] !== undefined);
      at = lastLive ? STEP_INDEX[lastLive.status] : 0;
    }
    const sub = (s) => {
      if (s === "accepted") return d.source === "private" ? t("step.accepted.p") : d.source === "auction" ? t("step.accepted.auction") : d.source === "offer" ? t("step.accepted.offer") : t("step.accepted.s", { m: C.ACCEPT_TIMEOUT_MIN });
      if (s === "sent") return t("step.sent.s", { m: C.SEND_TIMEOUT_MIN });
      return t("step." + s + ".s");
    };
    const items = STEPS.map((s, i) => {
      const done = i < at, active = i === at && !failed && d.status !== "dispute", fail = i === at && failed;
      const cls = done ? "is-done" : active ? "is-active" : fail ? "is-fail" : "";
      return `<li class="tl ${cls}" style="--i:${i}"><span class="tl__dot">${done ? ICONS.check : fail ? ICONS.x : i + 1}</span><div><div class="tl__title">${t("step." + s + ".t")}</div><div class="tl__sub">${sub(s)}</div></div></li>`;
    });
    if (failed) items.push(`<li class="tl is-done"><span class="tl__dot">${ICONS.check}</span><div><div class="tl__title">${t("step." + d.status + ".t")}</div><div class="tl__sub">${t("step." + d.status + ".s")}</div></div></li>`);
    return `<ul class="timeline">${items.join("")}</ul>`;
  }

  function dealView(d) {
    const g = d.gift, isBuyer = d.role === "buyer", u = d.counterpart.username, nft = nftName(g);
    const timed = d.deadline && ["awaiting_payment", "paid", "accepted"].includes(d.status);
    const timerLabel = {
      awaiting_payment: isBuyer ? t("timer.pay") : t("timer.payWait"),
      paid: isBuyer ? t("timer.acceptBuyer") : t("timer.acceptSeller"),
      accepted: isBuyer ? t("timer.sendBuyer") : t("timer.sendSeller"),
    }[d.status];
    const params = { u, nft, sum: sum(isBuyer ? d.total : d.payout, d.currency), p: C.FEE_PERCENT };
    const kind = { paid: "info", sent: "info", completed: "ok" }[d.status] || "";
    let hint = "", actions = "", extra = "";

    if (isBuyer && STEP_INDEX[d.status] !== undefined) hint = note(t(`hint.b.${d.status === "awaiting_payment" ? "awaiting" : d.status}`, params), kind);
    if (!isBuyer && STEP_INDEX[d.status] !== undefined) {
      if (d.status === "awaiting_payment") hint = note(t(d.source === "private" ? "hint.s.awaiting" : "hint.s.awaitingAgreed", params), "info");
      else hint = note(t(`hint.s.${d.status}`, params), kind);
    }

    if (isBuyer && d.status === "awaiting_payment") {
      actions = `<button class="btn btn--primary btn--glow" data-action="deal-pay" data-id="${d.id}">${t("btn.pay")} · ${esc(sum(d.total, d.currency))}</button>
                 <button class="btn btn--ghost mt-8" data-action="deal" data-act="cancel" data-id="${d.id}">${t("btn.cancel")}</button>`;
    }
    if (!isBuyer && d.status === "awaiting_payment" && d.agreed) {
      if (d.source === "private") extra = `
        <div class="card mt-12 linkbox">
          <span class="field__label" style="margin:0 0 8px">${UI.ei("link")} ${t("deal.link")}</span>
          <div class="linkbox__url" id="deal-link">${esc(d.link)}</div>
          <div class="btn-row mt-12">
            <button class="btn btn--ghost btn--sm" data-action="copy-link" data-link="${esc(d.link)}">${t("btn.copy")}</button>
            <button class="btn btn--primary btn--sm" data-action="share-link" data-link="${esc(d.link)}" data-text="${esc(t("deal.shareText", { nft, sum: sum(d.total, d.currency) }).replace(/&amp;/g, "&"))}">${ICONS.send} ${t("btn.shareTg")}</button>
          </div>
        </div>`;
      actions = `<button class="btn btn--ghost" data-action="deal" data-act="cancel" data-id="${d.id}">${t("btn.cancel")}</button>`;
    }
    if (!isBuyer && d.status === "paid") actions = `<button class="btn btn--primary btn--glow" data-action="deal" data-act="accept" data-id="${d.id}">${t("btn.accept")}</button>`;
    if (!isBuyer && d.status === "accepted") {
      actions = `<button class="btn btn--ghost" data-action="open-user" data-username="${esc(u)}">${t("btn.openUser", { u })}</button>
                 <button class="btn btn--primary btn--glow mt-8" data-action="deal" data-act="sent" data-id="${d.id}">${t("btn.sent")}</button>`;
    }
    if (d.status === "refunded") hint = note(t(isBuyer ? "hint.refunded.b" : "hint.refunded.s"));
    if (d.status === "cancelled") hint = note(t("hint.cancelled"));
    if (d.status === "dispute") hint = note(t("hint.dispute", { u: C.SUPPORT_USERNAME }));
    if (["paid", "accepted", "sent"].includes(d.status)) {
      actions += `<button class="btn btn--danger mt-8" data-action="dispute" data-id="${d.id}">${state.disputeArmed ? t("btn.disputeConfirm") : t("btn.dispute")}</button>`;
    }

    return `
      <div class="list-item" style="padding-right:40px">
        ${nftArt(g, "sm")}
        <div class="list-item__main">
          <div class="list-item__title">${esc(nft)}</div>
          <div class="list-item__sub">${t("deal.id", { id: d.id })} · ${isBuyer ? t("deal.seller") : t("deal.buyer")} @${esc(u)}</div>
        </div>
      </div>
      <div class="row between mt-12">
        <div class="row" style="gap:6px;flex-wrap:wrap">${badge(d.status)}${srcBadge(d)}</div>
        ${C.MOCK ? '<span class="demo-flag">DEMO</span>' : ""}
      </div>
      ${timed ? `<div class="timer mt-12"><span class="small">${timerLabel}</span><span class="timer__val" data-ends="${d.deadline}">${countdown(d.deadline)}</span></div>` : '<div class="mt-12"></div>'}
      ${extra}
      <div class="card ${extra ? "mt-12" : ""}">${timeline(d)}</div>
      <div class="card mt-12">
        <div class="kv"><span>${t("deal.nftPrice")}</span>${price(d.price, d.currency)}</div>
        <div class="kv"><span>${t("fee.line", { p: C.FEE_PERCENT, who: payerLabel(d.feePayer) })}</span>${price(isBuyer ? d.buyerFee : d.sellerFee, d.currency)}</div>
        <div class="kv kv--total"><span>${isBuyer ? t("deal.youPay") : t("deal.youGet")}</span>${price(isBuyer ? d.total : d.payout, d.currency)}</div>
      </div>
      ${hint ? `<div class="mt-12">${hint}</div>` : ""}
      ${actions ? `<div class="mt-16">${actions}</div>` : ""}`;
  }

  function note(html, kind) {
    return `<div class="note ${kind ? "note--" + kind : ""}"><span>${kind === "ok" ? UI.ei("check") : kind === "info" ? UI.ei("hourglass") : UI.ei("warning")}</span><div>${html}</div></div>`;
  }

  async function dealAction(id, act, btn) {
    if (btn) btn.disabled = true;
    try {
      await API.dealAction(id, act);
      TG.haptic("medium");
      state.disputeArmed = false;
      await refreshDeal(true);
      refreshBadges();
    } catch (e) { toast(e.message, "err"); if (btn) btn.disabled = false; }
  }

  async function payDeal(id, btn) {
    if (C.MOCK) { toast(t("demoPay"), "", "coin"); return dealAction(id, "pay", btn); }
    const d = await API.deal(id); // реально: рахунок Crypto Pay; статус «paid» поставить бекенд після вебхука
    if (d.payUrl) TG.openTelegramLink(d.payUrl);
  }

  async function copyLink(link) {
    try { await navigator.clipboard.writeText(link); toast(t("copied"), "ok", "link"); }
    catch (e) {
      const el = $("#deal-link");
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast(t("copyFail"), "err");
    }
  }

  /* =============== МОЇ УГОДИ: Покупки · Продажі · Торг · Ставки =============== */
  function renderDeals() {
    const v = state.deals.view;
    const seg = (key, label) => `<button class="segment__btn ${v === key ? "is-active" : ""}" data-action="deals-view" data-view="${key}">${label}<i class="seg-badge" id="segb-${key}" hidden></i></button>`;
    $("#screen").innerHTML = `
      <h1 class="h1">${t("deals.title")}</h1>
      <p class="muted small" style="margin:6px 0 0">${t("deals.sub")}</p>
      <div class="segment segment--scroll">
        ${seg("buyer", t("deals.buys"))}${seg("seller", t("deals.sales"))}${seg("swaps", t("deals.swaps"))}${seg("offers", t("deals.offers"))}${seg("bids", t("deals.bids"))}
      </div>
      <div class="mt-16" id="deals-list"><div class="skeleton" style="aspect-ratio:4"></div></div>`;
    loadDealsView();
    refreshBadges();
  }

  async function loadDealsView() {
    const el = $("#deals-list");
    if (!el) return;
    const v = state.deals.view;
    try {
      if (v === "offers") return renderOffersView(el, await API.offers());
      if (v === "bids") return renderBidsView(el, await API.myBids());
      if (v === "swaps") return renderSwapsView(el);
      const items = await API.deals(v);
      if (!$("#deals-list")) return;
      el.innerHTML = items.length
        ? `<div class="list">${items.map(dealCard).join("")}</div>`
        : emptyState(v === "buyer" ? "cart" : "tag", v === "buyer" ? t("deals.emptyBuy") : t("deals.emptySell"), "", v === "buyer" ? "market" : "sell", v === "buyer" ? t("deals.toMarket") : t("deals.toSell"));
    } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  const emptyState = (icon, title, sub, tab, btn) => `
    <div class="empty"><div class="empty__icon">${UI.ei(icon)}</div><b>${title}</b>${sub ? `<div class="small mt-8">${sub}</div>` : ""}
      ${tab ? `<div class="mt-16"><button class="btn btn--ghost btn--sm" data-action="tab" data-tab="${tab}">${btn}</button></div>` : ""}</div>`;

  const dealCard = (d, i = 0) => `
    <button class="card list-item deal-card" style="--i:${i}" data-action="open-deal" data-id="${d.id}">
      ${nftArt(d.gift, "sm")}
      <div class="list-item__main">
        <div class="list-item__title">${SRC_ICON[d.source] ? `<span class="lock-ic">${SRC_ICON[d.source]}</span>` : ""}${esc(nftName(d.gift))}</div>
        <div class="list-item__sub">${d.role === "buyer" ? t("deals.from", { u: d.counterpart.username }) : t("deals.for", { u: d.counterpart.username })} · ${timeAgo(d.createdAt)}</div>
      </div>
      <div class="list-item__end">${price(d.role === "buyer" ? d.total : d.price, d.currency)}${badge(d.status)}</div>
    </button>`;

  const OFFER_CLS = { pending: "warn", countered: "info", accepted: "ok", declined: "muted", cancelled: "muted" };
  function offerCard(o, i) {
    const incoming = o.role === "seller";
    let actions = "";
    if (incoming && o.status === "pending") actions = `
      <button class="btn btn--ghost btn--sm" data-action="offer-act" data-id="${o.id}" data-act="decline">${t("offer.decline")}</button>
      <button class="btn btn--ghost btn--sm" data-action="offer-counter" data-id="${o.id}">${t("offer.counter")}</button>
      <button class="btn btn--primary btn--sm" data-action="offer-act" data-id="${o.id}" data-act="accept">${t("offer.accept")}</button>`;
    if (!incoming && o.status === "countered") actions = `
      <button class="btn btn--ghost btn--sm" data-action="offer-act" data-id="${o.id}" data-act="decline">${t("offer.decline")}</button>
      <button class="btn btn--primary btn--sm" data-action="offer-act" data-id="${o.id}" data-act="accept">${t("offer.acceptSum", { sum: UI.fmtNum(o.counter, o.currency) })}</button>`;
    if (!incoming && o.status === "pending") actions = `<button class="btn btn--ghost btn--sm" data-action="offer-act" data-id="${o.id}" data-act="cancel">${t("offer.cancel")}</button>`;
    if (o.status === "accepted" && o.dealId) actions = `<button class="btn btn--primary btn--sm" data-action="open-deal" data-id="${o.dealId}">${t("offer.openDeal")}</button>`;
    return `
      <div class="card offer-card" style="--i:${i}">
        <div class="list-item">
          ${nftArt(o.gift, "sm")}
          <div class="list-item__main">
            <div class="list-item__title">${esc(nftName(o.gift))}</div>
            <div class="list-item__sub">${incoming ? t("offer.from", { u: o.counterpart.username }) : t("offer.to", { u: o.counterpart.username })} · ${timeAgo(o.createdAt)}</div>
          </div>
          <span class="badge badge--${OFFER_CLS[o.status]}">${t("offer.status." + o.status)}</span>
        </div>
        <div class="offer-prices">
          <div><span>${t("offer.listPrice")}</span>${price(o.listPrice, o.currency)}</div>
          <div class="is-offer"><span>${t("offer.offer")}</span>${price(o.amount, o.currency)}</div>
          ${o.counter ? `<div class="is-counter"><span>${t("offer.counter")}</span>${price(o.counter, o.currency)}</div>` : ""}
        </div>
        ${actions ? `<div class="offer-actions">${actions}</div>` : ""}
      </div>`;
  }

  function renderOffersView(el, { incoming, outgoing }) {
    if (!$("#deals-list")) return;
    if (!incoming.length && !outgoing.length) { el.innerHTML = emptyState("handshake", t("offers.empty"), t("offers.emptyHint"), "sell", t("deals.toSell")); return; }
    el.innerHTML = `
      ${incoming.length ? `<div class="section-head" style="margin-top:0"><h2 class="h2">${t("offer.incoming")}</h2></div><div class="list">${incoming.map(offerCard).join("")}</div>` : ""}
      ${outgoing.length ? `<div class="section-head"${incoming.length ? "" : ' style="margin-top:0"'}><h2 class="h2">${t("offer.outgoing")}</h2></div><div class="list">${outgoing.map(offerCard).join("")}</div>` : ""}`;
  }

  const BID_CLS = { leading: "ok", outbid: "warn", won: "ok", lost: "muted" };
  function renderBidsView(el, bids) {
    if (!$("#deals-list")) return;
    if (!bids.length) { el.innerHTML = emptyState("gavel", t("bids.empty"), "", "market", t("bids.toAuctions")); return; }
    el.innerHTML = `<div class="list">${bids.map((b, i) => {
      const l = b.listing, active = l.status === "active";
      return `
      <button class="card list-item deal-card" style="--i:${i}" data-action="open-listing" data-id="${l.id}">
        ${nftArt(l.gift, "sm")}
        <div class="list-item__main">
          <div class="list-item__title"><span class="lock-ic">${UI.ei("gavel")}</span>${esc(nftName(l.gift))}</div>
          <div class="list-item__sub">${t("bid.my")}: ${esc(sum(b.myBid, l.currency))}${active ? ` · <span class="ends-inline" data-ends="${l.endsAt}">${countdown(l.endsAt)}</span>` : ""}</div>
        </div>
        <div class="list-item__end">${price(l.price, l.currency)}<span class="badge badge--${BID_CLS[b.state]}">${t("bid." + b.state)}</span></div>
      </button>`;
    }).join("")}</div>`;
  }

  // Лічильники дій, що чекають користувача
  function applyBadges(c) {
    const n = (k) => Number(c[k]) || 0;
    const nSwap = n("swaps") + n("invites");
    const set = (sel, v) => { const el = $(sel); if (el) { el.hidden = !v; el.textContent = v; } };
    set("#deals-badge", n("buyer") + n("seller") + n("offers") + n("bids") + nSwap);
    set("#private-badge", n("incoming") + n("invites"));
    set("#incoming-count", n("incoming") + n("invites"));
    set("#segb-buyer", n("buyer")); set("#segb-seller", n("seller")); set("#segb-offers", n("offers")); set("#segb-bids", n("bids")); set("#segb-swaps", nSwap);
  }
  async function refreshBadges() {
    if (API.poll) return livePoll(); // сервер: лічильники й події одним запитом
    try {
      const [b, s, o, bids, swaps, invites] = await Promise.all([API.deals("buyer"), API.deals("seller"), API.offers(), API.myBids(), API.swaps(), API.exchangeInvites()]);
      applyBadges({
        buyer: b.filter((d) => !d.private && d.status === "awaiting_payment").length,
        seller: s.filter((d) => ["paid", "accepted"].includes(d.status)).length,
        offers: o.incoming.filter((x) => x.status === "pending").length + o.outgoing.filter((x) => x.status === "countered").length,
        bids: bids.filter((x) => x.state === "outbid").length,
        swaps: swaps.filter(swapNeedsMe).length,
        invites: invites.length,
        incoming: b.filter((d) => d.private && d.status === "awaiting_payment").length,
      });
    } catch (e) {}
  }
  let polling = false;
  async function livePoll() {
    if (document.hidden || polling || !TG.initData) return; // у фоні й поза Telegram не опитуємо
    polling = true;
    try {
      const r = await API.poll();
      applyBadges(r.badges || {});
      handleEvents(r.events || [], true);
    } catch (e) {} finally { polling = false; }
  }

  /* =============== ПОДІЇ (перебили ставку, нова пропозиція…) =============== */
  const EV = { // тип → [текст, вид, іконка]
    outbid: ["ev.outbid", "", "gavel"], won: ["ev.won", "ok", "trophy"], lost: ["ev.lost", "", "hourglass"], sold: ["ev.sold", "ok", "coin"], noBids: ["ev.noBids", "", "hourglass"],
    newBid: ["ev.newBid", "ok", "gavel"], offerNew: ["ev.offerNew", "ok", "handshake"], offerCountered: ["ev.offerCountered", "", "handshake"],
    offerAccepted: ["ev.offerAccepted", "ok", "handshake"], offerDeclined: ["ev.offerDeclined", "err", "handshake"], buyerAccepted: ["ev.buyerAccepted", "ok", "coin"], buyerDeclined: ["ev.buyerDeclined", "", "handshake"],
    exStarted: ["ev.exStarted", "ok", "handshake"], exStartedTopup: ["ev.exStartedTopup", "ok", "coin"], swapSafe: ["ev.swapSafe", "", "lock"], swapDone: ["ev.swapDone", "ok", "trophy"],
  };
  async function pollEvents() {
    if (API.poll) return;
    let evs;
    try { evs = await API.events(); } catch (e) { return; }
    handleEvents(evs);
  }
  function handleEvents(evs, live) {
    if (!evs || !evs.length) return;
    evs.forEach((ev) => {
      const [key, kind, icon] = EV[ev.type] || [];
      if (!key) return;
      toast(t(key, { nft: ev.nft, u: ev.u || "", sum: ev.sum != null ? sum(ev.sum, ev.currency) : "" }), kind, icon);
      if (ev.type === "won" || ev.type === "sold" || ev.type === "swapDone") UI.confetti();
    });
    if (!live) refreshBadges();
    if (state.tab === "deals") loadDealsView();
    if (state.tab === "profile") loadMyListings();
    if (state.tab === "market" && state.market.mode === "auction") loadListings(true);
    if (state.sheetCtx && state.sheetCtx.kind === "auction") refreshAuction(true);
    if (state.sheetCtx && state.sheetCtx.kind === "swap") refreshSwap(true);
    if (state.tab === "market" && state.market.mode === "exchange") loadListings(true);
  }

  /* =============== СПІЛЬНІ БЛОКИ ФОРМ (Продати / Угода / Обмін) =============== */
  async function loadGifts(scope) {
    const el = $(`#${scope}-gifts`);
    if (!el) return;
    el.innerHTML = Array(3).fill('<div class="skeleton" style="aspect-ratio:.8"></div>').join("");
    try { state[scope].gifts = await API.myGifts(); }
    catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    renderPicker(scope);
  }
  function renderPicker(scope) {
    const el = $(`#${scope}-gifts`);
    if (!el) return;
    const s = state[scope];
    // в обміні показуємо лише NFT, які хоче автор
    const list = scope === "ex" && s.wantCols.length ? s.gifts.filter((g) => s.wantCols.includes(g.collectionId)) : s.gifts;
    if (!list.length) {
      el.classList.add("pick-grid--empty");
      el.innerHTML = `<div class="card small muted">${scope === "ex" ? t("ex.noMatch", { w: wantNames(s.wantCols) }) : t("sell.noGifts")}</div>`;
      return;
    }
    el.classList.remove("pick-grid--empty");
    el.innerHTML = list.map((g, i) => {
      const lock = !g.canTransfer ? `<div class="pick__lock">${UI.ei("lock", "ei--md")}<span>${t("sell.locked", { date: new Date(g.transferAvailableAt).toLocaleDateString(I18N.locale) })}</span></div>` : "";
      return `<button class="pick ${s.selected === g.slug ? "is-active" : ""}" style="--i:${i}" data-action="pick-gift" data-scope="${scope}" data-slug="${esc(g.slug)}" ${g.canTransfer ? "" : "disabled"}>
        ${nftArt(g)}<div class="pick__name">${esc(nftName(g))}</div>${lock}<span class="pick__check">${ICONS.check}</span></button>`;
    }).join("");
  }
  const currencySegment = (scope) => `
    <div class="segment" style="margin-top:0">
      ${Object.values(C.CURRENCIES).map((c) => `<button class="segment__btn ${state[scope].currency === c.code ? "is-active" : ""}" data-action="set-currency" data-scope="${scope}" data-cur="${c.code}">${UI.curIcon(c.code)} ${c.label}</button>`).join("")}
    </div>`;
  const priceInput = (scope, id = scope + "-price", key = "price", ph = "0") => `
    <div class="input-wrap">
      <input class="input input--price" id="${id}" data-scope="${scope}" data-key="${key}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="${esc(ph)}" value="${esc(state[scope][key])}" />
      <span class="input-wrap__suffix cur-suffix" data-scope="${scope}">${esc(state[scope].currency)}</span>
    </div>`;
  // Сегмент-перемикач для будь-якого поля форми: optSeg("sell", "feePayer", [["buyer","Покупець"], …])
  const optSeg = (scope, key, opts) => `
    <div class="segment" style="margin-top:0">
      ${opts.map(([v, label]) => `<button class="segment__btn ${state[scope][key] === v ? "is-active" : ""}" data-action="set-opt" data-scope="${scope}" data-key="${key}" data-value="${v}">${label}</button>`).join("")}
    </div>`;
  const payerSeg = (scope) => optSeg(scope, "feePayer", [["buyer", t("payer.buyer")], ["seller", t("payer.seller")], ["split", t("payer.split")]]);
  const payerLabel = (p) => t("payer.l." + (p || C.DEFAULT_FEE_PAYER));
  const exPayerLabel = (p, myRole) => p === "split" ? t("ex.payer.split") : (myRole && p === myRole) ? t("ex.me") : t("ex.payer." + p);
  const wantNames = (ids) => {
    if (!ids || !ids.length) return t("ex.any");
    const cat = state.catalog;
    const names = ids.map((id) => (cat && (cat.collections.find((c) => c.id === id) || {}).name) || id);
    return names.slice(0, 2).join(", ") + (names.length > 2 ? " +" + (names.length - 2) : "");
  };

  function renderSummary(scope) {
    if (scope === "ex") return renderExSheetSummary();
    const el = $(`#${scope}-summary`);
    if (!el) return;
    const s = state[scope];
    const p = parseFloat(s.price) || 0;
    if (scope === "sell" && s.type === "exchange") return renderExSummary(el, s);
    if (scope === "sell" && s.type === "auction") {
      const h = s.customDur ? parseFloat(s.hours) || 0 : s.durationH;
      el.innerHTML = `
        <div class="kv"><span>${t("auction.startPrice")}</span>${price(p, s.currency)}</div>
        <div class="kv"><span>${t("auction.step")}</span><b>+${C.AUCTION_MIN_STEP_PERCENT}%</b></div>
        <div class="kv"><span>${t("sell.endsIn")}</span><b>${h ? t("sell.endsInVal", { v: UI.fmtDur(h) }) : "—"}</b></div>
        <div class="kv"><span>${t("fee.line", { p: C.FEE_PERCENT, who: payerLabel(s.feePayer) })}</span><b>${C.FEE_PERCENT}%</b></div>
        <div class="kv kv--total"><span>${t("sell.auctionGet")}</span><b class="accent">${t("sell.auctionGetVal")}${s.feePayer === "buyer" ? "" : " − " + (s.feePayer === "split" ? C.FEE_PERCENT / 2 : C.FEE_PERCENT) + "%"}</b></div>
        <div class="small muted mt-8">${t("sell.payout")}</div>`;
      return;
    }
    const f = API.calcFee(p, s.feePayer);
    el.innerHTML = `
      <div class="kv"><span>${t("sell.buyerPays")}</span>${price(f.total, s.currency)}</div>
      <div class="kv"><span>${t("fee.line", { p: C.FEE_PERCENT, who: payerLabel(s.feePayer) })}</span>${price(f.fee, s.currency)}</div>
      <div class="kv kv--total"><span>${t("sell.youGet")}</span>${price(f.payout, s.currency)}</div>
      <div class="small muted mt-8">${t("sell.payout")}</div>`;
  }
  function renderExSummary(el, s) {
    const f = API.calcSwap(parseFloat(s.value) || 0, 0, s.exFeePayer, null);
    el.innerHTML = `
      <div class="kv"><span>${t("ex.value")}</span>${price(f.value, s.currency)}</div>
      <div class="kv"><span>${t("ex.feeNft", { p: C.EXCHANGE_FEE_PERCENT })}</span>${price(f.feeNft, s.currency)}</div>
      <div class="kv"><span>${t("ex.feeWho")}</span><b>${exPayerLabel(s.exFeePayer, "creator")}</b></div>
      <div class="kv kv--total"><span>${t("ex.youPay")}</span>${price(f.creatorPays, s.currency)}</div>
      <div class="kv"><span>${t("ex.otherPays")}</span>${price(f.takerPays, s.currency)}</div>
      <div class="small muted mt-8">${UI.ei("coin", "ei--inline")} ${t("ex.topupByTaker", { p: C.TOPUP_FEE_PERCENT })}</div>
      <div class="small muted mt-8">${UI.ei("star", "ei--inline")} ${t("ex.starsNote", { stars: C.TRANSFER_STARS })}</div>`;
  }
  function validateForm(scope) {
    const s = state[scope];
    const p = parseFloat(s.price);
    if (!s.selected) { toast(t("err.pickNft"), "err"); return null; }
    if (!(p >= C.MIN_PRICE[s.currency])) { toast(t("err.minPrice", { v: C.MIN_PRICE[s.currency] + " " + s.currency }), "err"); return null; }
    return p;
  }

  /* =============== ПРОДАТИ: фікс. ціна (+торг) · аукціон · обмін =============== */
  function renderSell() {
    const s = state.sell;
    const type = s.type, auction = type === "auction", exchange = type === "exchange";
    const fmt = (key, icon, label) => `<button class="format ${type === key ? "is-active" : ""}" data-action="sell-type" data-type="${key}"><span class="format__ic">${icon}</span><b>${label}</b></button>`;
    $("#screen").innerHTML = `
      <div class="page-head">
        <div class="page-head__icon">${exchange ? UI.ei("handshake") : auction ? UI.ei("gavel") : UI.ei("bolt")}</div>
        <div><h1 class="h1">${t("sell.title")}</h1><p class="muted small" style="margin:4px 0 0">${t("sell.sub")}</p></div>
      </div>

      <span class="field__label step-label">${t("sell.step1")}</span>
      <div id="sell-gifts" class="pick-grid"></div>

      <div class="field"><span class="field__label">${t("sell.format")}</span>
        <div class="format-grid format-grid--3">
          ${fmt("fixed", UI.ei("tag"), t("sell.fixed"))}${fmt("auction", UI.ei("gavel"), t("sell.auction"))}${fmt("exchange", UI.ei("handshake"), t("sell.exchange"))}
        </div>
      </div>
      ${exchange ? sellExchangeFields(s) : sellSaleFields(s)}`;
    renderSummary("sell");
    if (s.gifts) renderPicker("sell"); else loadGifts("sell");
  }

  function sellSaleFields(s) {
    const auction = s.type === "auction";
    return `
      <div class="field"><span class="field__label">${t("sell.stepCur")}</span>${currencySegment("sell")}</div>
      <div class="field"><span class="field__label">${auction ? t("sell.stepStart") : t("sell.stepPrice")}</span>${priceInput("sell")}</div>
      ${auction ? `
        <div class="field"><span class="field__label">${t("sell.stepDuration")}</span>
          <div class="dur-row">
            ${C.AUCTION_DURATIONS_H.map((h) => `<button class="dur ${!s.customDur && s.durationH === h ? "is-active" : ""}" data-action="sell-dur" data-h="${h}">${UI.fmtDur(h)}</button>`).join("")}
            <button class="dur ${s.customDur ? "is-active" : ""}" data-action="sell-dur" data-h="custom">${t("sell.custom")}</button>
          </div>
          ${s.customDur ? `<div class="input-wrap mt-8"><input class="input" id="sell-hours" type="number" inputmode="numeric" min="1" max="${C.AUCTION_MAX_H}" placeholder="1–${C.AUCTION_MAX_H}" value="${esc(s.hours)}" /><span class="input-wrap__suffix">${t("sell.hours")}</span></div>` : ""}
        </div>` : `
        <div class="card toggle-card mt-16">
          <div class="toggle-row">
            <span class="toggle-row__ic">${UI.ei("handshake")}</span>
            <div class="list-item__main"><b>${t("sell.offersToggle")}</b><div class="small muted">${t("sell.offersSub")}</div></div>
            <button class="switch ${s.allowOffers ? "is-on" : ""}" data-action="toggle-offers" role="switch" aria-checked="${s.allowOffers}"><i></i></button>
          </div>
          ${s.allowOffers ? `<div class="mt-12">${priceInput("sell", "sell-minoffer", "minOffer", t("sell.minOffer"))}</div>` : ""}
        </div>`}
      <div class="field"><span class="field__label">${t("fee.who", { p: C.FEE_PERCENT })}</span>${payerSeg("sell")}</div>
      <div class="card mt-16" id="sell-summary"></div>
      <div class="mt-12">${note(auction ? t("sell.auctionRules", { s: C.SEND_TIMEOUT_MIN }) : t("sell.rules", { a: C.ACCEPT_TIMEOUT_MIN, s: C.SEND_TIMEOUT_MIN }))}</div>
      <div class="mt-16"><button class="btn btn--primary btn--glow" data-action="submit-listing">${auction ? ICONS.gavel : ""} ${t("sell.submit")}</button></div>`;
  }

  function sellExchangeFields(s) {
    const cat = state.catalog;
    const wantChips = s.wantCols.map((id) => {
      const c = cat && cat.collections.find((x) => x.id === id);
      return `<span class="want-chip"><span class="want-chip__gi">${GI.gift(id)}</span>${esc(c ? c.name : id)}</span>`;
    }).join("");
    return `
      <div class="field"><span class="field__label">${t("ex.visibility")}</span>
        ${optSeg("sell", "visibility", [["public", t("ex.public")], ["private", t("ex.private")]])}
        <div class="small muted mt-8">${s.visibility === "public" ? t("ex.publicSub") : t("ex.privateSub")}</div>
        ${s.visibility === "private" ? `<div class="input-wrap input-wrap--at mt-8"><span class="input-wrap__prefix">@</span>
          <input class="input" id="sell-target" data-scope="sell" data-key="target" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("priv.buyerPh")}" value="${esc(s.target)}" /></div>` : ""}
      </div>
      <div class="field"><span class="field__label">${t("ex.want")}</span>
        ${optSeg("sell", "wantMode", [["any", t("ex.wantAny")], ["cols", t("ex.wantCols")]])}
        ${s.wantMode === "cols" ? `<div class="want-row mt-8">${wantChips}<button class="want-add" data-action="pick-want">+ ${t("ex.wantPick")}</button></div>` : ""}
      </div>
      <div class="field"><span class="field__label">${t("ex.valueStep")}</span>${currencySegment("sell")}
        <div class="mt-8">${priceInput("sell", "sell-value", "value", t("ex.valuePh"))}</div>
        <div class="small muted mt-8">${t("ex.valueHint", { p: C.EXCHANGE_FEE_PERCENT })}</div>
      </div>
      <div class="field"><span class="field__label">${t("ex.feeStep")}</span>
        ${optSeg("sell", "exFeePayer", [["creator", t("ex.me")], ["taker", t("ex.other")], ["split", t("ex.payer.split")]])}
      </div>
      <div class="card mt-16" id="sell-summary"></div>
      <div class="mt-12">${note(t("ex.rules", { safe: C.SAFE_USERNAME, m: C.SWAP_SAFE_TIMEOUT_MIN }), "info")}</div>
      <div class="mt-16"><button class="btn btn--primary btn--glow" data-action="submit-exchange">${ICONS.hand} ${t("ex.submit")}</button></div>`;
  }

  async function submitListing(btn) {
    const p = validateForm("sell");
    if (p == null) return;
    const s = state.sell;
    const auction = s.type === "auction";
    const durationH = auction ? (s.customDur ? parseFloat(s.hours) : s.durationH) : undefined;
    if (auction && !(durationH >= 1 && durationH <= C.AUCTION_MAX_H)) return toast(t("err.badDuration"), "err");
    btn.disabled = true;
    btn.textContent = t("sell.publishing");
    try {
      await API.createListing({ giftSlug: s.selected, type: s.type, price: p, currency: s.currency, feePayer: s.feePayer, allowOffers: !auction && s.allowOffers, minOffer: !auction && s.allowOffers && s.minOffer ? parseFloat(s.minOffer) : null, durationH });
      toast(auction ? t("sell.doneAuction") : t("sell.done"), "ok", auction ? "gavel" : "flame");
      UI.confetti();
      Object.assign(s, { selected: null, price: "", minOffer: "", gifts: null });
      renderSell();
    } catch (e) {
      toast(e.message, "err");
      btn.disabled = false;
      btn.textContent = t("sell.submit");
    }
  }

  async function submitExchange(btn) {
    const s = state.sell;
    if (!s.selected) return toast(t("err.pickNft"), "err");
    if (s.visibility === "private" && !/^[a-zA-Z0-9_]{4,32}$/.test((s.target || "").replace(/^@/, ""))) return toast(t("err.username"), "err");
    if (s.wantMode === "cols" && !s.wantCols.length) return toast(t("ex.pickWant"), "err");
    if (!(parseFloat(s.value) >= C.MIN_PRICE[s.currency])) return toast(t("err.badValue"), "err");
    btn.disabled = true;
    try {
      await API.createExchange({
        giftSlug: s.selected, visibility: s.visibility, targetUsername: s.target, wantCollections: s.wantMode === "cols" ? s.wantCols : [],
        value: parseFloat(s.value), currency: s.currency, feePayer: s.exFeePayer,
      });
      toast(s.visibility === "private" ? t("ex.createdPrivate") : t("ex.created"), "ok", "handshake");
      UI.confetti();
      Object.assign(s, { selected: null, value: "", target: "", gifts: null });
      renderSell();
    } catch (e) { toast(e.message, "err"); btn.disabled = false; }
  }

  /* =============== УГОДА (приватні продажі + запрошення до обміну) =============== */
  function renderPrivate() {
    const s = state.priv;
    $("#screen").innerHTML = `
      <div class="page-head">
        <div class="page-head__icon">${UI.ei("lock")}</div>
        <div><h1 class="h1">${t("priv.title")}</h1><p class="muted small" style="margin:4px 0 0">${t("priv.sub")}</p></div>
      </div>
      <div class="segment">
        <button class="segment__btn ${s.mode === "create" ? "is-active" : ""}" data-action="priv-mode" data-mode="create">${t("priv.create")}</button>
        <button class="segment__btn ${s.mode === "incoming" ? "is-active" : ""}" data-action="priv-mode" data-mode="incoming">${t("priv.incoming")} <i class="seg-badge" id="incoming-count" hidden></i></button>
      </div>
      <div id="priv-body"></div>`;
    const body = $("#priv-body");
    if (s.mode === "create") {
      body.innerHTML = `
        <div class="field"><span class="field__label">${t("priv.step1")}</span>
          <div class="input-wrap input-wrap--at"><span class="input-wrap__prefix">@</span>
            <input class="input" id="priv-username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("priv.buyerPh")}" value="${esc(s.username)}" />
          </div>
        </div>
        <span class="field__label step-label">${t("priv.step2")}</span>
        <div id="priv-gifts" class="pick-grid"></div>
        <div class="field"><span class="field__label">${t("priv.step3")}</span>${currencySegment("priv")}<div class="mt-8">${priceInput("priv")}</div></div>
        <div class="field"><span class="field__label">${t("fee.who", { p: C.FEE_PERCENT })}</span>${payerSeg("priv")}</div>
        <div class="card mt-16" id="priv-summary"></div>
        <div class="mt-12">${note(t("priv.note", { s: C.SEND_TIMEOUT_MIN }), "info")}</div>
        <div class="mt-16"><button class="btn btn--primary btn--glow" data-action="submit-private">${ICONS.lock} ${t("priv.submit")}</button></div>
        <div id="priv-mine"></div>`;
      renderSummary("priv");
      if (s.gifts) renderPicker("priv"); else loadGifts("priv");
    } else {
      body.innerHTML = `<div class="mt-16" id="priv-incoming"><div class="skeleton" style="aspect-ratio:4"></div></div>`;
    }
    loadPrivateLists();
    refreshBadges();
  }

  async function loadPrivateLists() {
    const s = state.priv;
    if (s.mode === "create") {
      const mine = (await API.deals("seller")).filter((d) => d.source === "private");
      const el = $("#priv-mine");
      if (el) el.innerHTML = mine.length ? `<div class="section-head"><h2 class="h2">${t("priv.mine")}</h2></div><div class="list">${mine.map(dealCard).join("")}</div>` : "";
    } else {
      const [deals, invites] = await Promise.all([API.deals("buyer"), API.exchangeInvites()]);
      const inc = deals.filter((d) => d.source === "private");
      const el = $("#priv-incoming");
      if (!el) return;
      el.innerHTML = inc.length || invites.length
        ? `${invites.length ? `<div class="section-head" style="margin-top:0"><h2 class="h2">${t("swaps.invites")}</h2></div><div class="list">${invites.map(inviteCard).join("")}</div>` : ""}
           ${inc.length ? `<div class="section-head"${invites.length ? "" : ' style="margin-top:0"'}><h2 class="h2">${t("priv.title")}</h2></div><div class="list">${inc.map(dealCard).join("")}</div>` : ""}`
        : emptyState("inbox", t("priv.emptyIncoming"), t("priv.incomingHint"));
    }
  }

  async function submitPrivate(btn) {
    const s = state.priv;
    const u = s.username.replace(/^@/, "").trim();
    if (!/^[a-zA-Z0-9_]{4,32}$/.test(u)) return toast(t("err.username"), "err");
    const p = validateForm("priv");
    if (p == null) return;
    btn.disabled = true;
    btn.textContent = t("priv.creating");
    try {
      const deal = await API.createPrivateDeal({ buyerUsername: u, giftSlug: s.selected, price: p, currency: s.currency, feePayer: s.feePayer });
      toast(t("priv.created"), "ok", "lock");
      Object.assign(s, { username: "", selected: null, price: "", gifts: null });
      renderPrivate();
      openDeal(deal.id);
    } catch (e) {
      toast(e.message, "err");
      btn.disabled = false;
      btn.innerHTML = `${ICONS.lock} ${t("priv.submit")}`;
    }
  }

  /* =============== ОБМІНИ: картки, шторка обміну, шторка угоди-обміну =============== */
  const topupTag = (l, mine) => {
    if (!l.topup || !l.topupFrom) return "";
    // з погляду глядача: якщо доплачує автор — «+X вам», якщо хоче доплату — «доплата X»
    const toViewer = mine ? l.topupFrom === "taker" : l.topupFrom === "creator";
    return `<span class="topup-tag ${toViewer ? "is-plus" : ""}">${toViewer ? t("ex.topupToYou", { sum: sum(l.topup, l.currency) }) : t("ex.topupFromYou", { sum: sum(l.topup, l.currency) })}</span>`;
  };
  const wantLine = (l) => {
    const ids = l.want.collections;
    const icons = ids.slice(0, 3).map((id) => `<span class="want-ic">${GI.gift(id)}</span>`).join("");
    return `<span class="want-line">${t("ex.wants")} ${icons}<b>${esc(wantNames(ids))}</b></span>`;
  };

  function exCard(l, i) {
    const g = l.gift;
    const extra = `
      <span class="nft-art__badge">#${g.number}</span>
      <button class="fav ${state.favs.has(l.id) ? "is-on" : ""}" data-action="fav" data-id="${l.id}" aria-label="fav">${ICONS.heart}</button>
      <span class="ex-badge">${UI.ei("handshake", "ei--tag")}${t("ex.tag")}</span>
      ${topupTag(l, l.seller.id === ME())}`;
    return `
    <div class="nft-card nft-card--ex" role="button" tabindex="0" style="--i:${Math.min(i, 12)};--art-a:${g.colors[0]};--art-b:${g.colors[1]}" data-action="open-listing" data-id="${l.id}">
      ${nftArt(g, "", extra)}
      <div class="nft-card__body">
        <div class="nft-card__name">${esc(g.collection)}</div>
        <div class="nft-card__meta">${wantLine(l)}</div>
        <div class="nft-card__row">${price(l.value, l.currency)}<span class="nft-card__buy nft-card__buy--ex">${t("ex.tag")}</span></div>
      </div>
    </div>`;
  }

  const inviteCard = (l, i = 0) => `
    <button class="card list-item deal-card" style="--i:${i}" data-action="open-listing" data-id="${l.id}">
      ${nftArt(l.gift, "sm")}
      <div class="list-item__main">
        <div class="list-item__title"><span class="lock-ic">${UI.ei("handshake")}</span>${esc(nftName(l.gift))}</div>
        <div class="list-item__sub">${t("offer.from", { u: l.seller.username })} · ${esc(wantNames(l.want.collections))}</div>
      </div>
      <div class="list-item__end">${price(l.value, l.currency)}${topupTag(l, false)}</div>
    </button>`;

  async function renderExchangeSheet(l) {
    const own = l.seller.id === ME();
    await getCatalog();
    // доплату обирає той, хто починає обмін (не автор)
    state.ex = { gifts: [], selected: null, wantCols: l.want.collections, listingId: l.id, currency: l.currency, l, topupMode: "none", topup: "" };
    const visBadge = `<span class="ex-badge ex-badge--lg">${UI.ei("handshake", "ei--tag")}${l.visibility === "private" ? t("ex.private") : t("ex.tag")}</span>`;
    setSheet(`
      ${nftHeader(l, visBadge)}
      <div class="card mt-12 want-card">
        <span class="field__label" style="margin:0 0 8px">${t("ex.wants")}</span>
        <div class="want-row">${l.want.collections.length ? l.want.collections.map((id) => `<span class="want-chip"><span class="want-chip__gi">${GI.gift(id)}</span>${esc(wantNames([id]))}</span>`).join("") : `<span class="want-chip">${UI.ei("sparkle", "ei--tag")} ${t("ex.wantAny")}</span>`}</div>
      </div>
      ${own ? "" : `
        <span class="field__label step-label">${t("ex.pickYours")}</span><div id="ex-gifts" class="pick-grid"></div>
        <div class="field"><span class="field__label">${t("ex.topupTaker")}</span>
          <div id="ex-topup"></div>
        </div>`}
      <div class="card mt-12" id="ex-summary"></div>
      <details class="card mt-12 how" ${own ? "" : "open"}>
        <summary class="row">${UI.ei("safe")}<b>${t("ex.how.title")}</b></summary>
        <ol class="how__list small muted">
          <li>${t("ex.how.1")}</li><li>${t("ex.how.2", { safe: C.SAFE_USERNAME })}</li><li>${t("ex.how.3")}</li><li>${t("ex.how.4", { stars: C.TRANSFER_STARS })}</li>
        </ol>
      </details>
      <div class="sheet__footer">
        ${own ? `<button class="btn btn--ghost" disabled>${t("ex.own")}</button>`
              : `<button class="btn btn--primary btn--glow" id="ex-start" data-action="start-exchange" data-id="${l.id}" disabled></button>`}
      </div>`);
    renderExTopup();
    renderExSheetSummary();
    if (!own) loadGifts("ex");
  }

  // Блок доплати для того, хто починає обмін: «Без доплати» / «Я доплачу» + сума
  function renderExTopup() {
    const el = $("#ex-topup");
    if (!el || !state.ex) return;
    const x = state.ex;
    el.innerHTML = `
      ${optSeg("ex", "topupMode", [["none", t("ex.topupNone")], ["me", t("ex.topupMe")]])}
      ${x.topupMode === "me" ? `<div class="mt-8">${priceInput("ex", "ex-topup-amount", "topup", t("ex.topupPh"))}</div>` : ""}
      <div class="small muted mt-8">${t("ex.topupTakerHint", { p: C.TOPUP_FEE_PERCENT })}</div>`;
  }

  // Підсумок у шторці обміну (перераховується, коли покупець змінює доплату)
  function renderExSheetSummary() {
    const el = $("#ex-summary");
    if (!el || !state.ex) return;
    const x = state.ex, l = x.l;
    const own = l.seller.id === ME();
    const topup = !own && x.topupMode === "me" ? parseFloat(x.topup) || 0 : 0;
    const f = API.calcSwap(l.value, topup, l.feePayer, topup ? "taker" : null);
    el.innerHTML = `
